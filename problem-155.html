<script>
  // Prevent orphaned commas/periods/semicolons/colons at the start of a
  // line. Inline math (`<mjx-container>`) is rendered as an inline-block
  // atom, so the browser can wrap between the container and a trailing
  // punctuation character. We wrap each `<mjx-container>` + the
  // immediately-following punctuation in a `white-space: nowrap` span so
  // the pair acts as a single line-breaking unit.
  window.glueOrphanPunctuation = function (root) {
    if (!root || !root.querySelectorAll) return;
    var containers = root.querySelectorAll('mjx-container');
    containers.forEach(function (mjx) {
      if (mjx.dataset && mjx.dataset.gluedPunc) return;
      var next = mjx.nextSibling;
      if (!next || next.nodeType !== Node.TEXT_NODE) return;
      var t = next.nodeValue || '';
      var m = t.match(/^[.,;:!?)\]]+/);
      if (!m) return;
      var punc = m[0];
      var rest = t.slice(punc.length);
      var wrap = document.createElement('span');
      wrap.style.whiteSpace = 'nowrap';
      mjx.parentNode.insertBefore(wrap, mjx);
      wrap.appendChild(mjx);
      wrap.appendChild(document.createTextNode(punc));
      next.nodeValue = rest;
      if (mjx.dataset) mjx.dataset.gluedPunc = '1';
    });
  };
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      // Recognise BOTH `$$...$$` and `\[...\]` as display-math
      // delimiters. Transcribed Matura problems use `\[...\]` natively,
      // so without this MathJax silently leaves the math as raw text.
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: false
    },
    options: {
      // Keep MathJax's own defaults (which include `mjx-container` so
      // already-typeset math isn't reprocessed) and add the editing
      // shells we never want it to enter.
      skipHtmlTags: { '[+]': ['textarea'] }
    },
    startup: {
      ready: function () {
        // Wrap typesetPromise so every successful typeset is followed
        // by a glueOrphanPunctuation pass on the just-typeset roots.
        // This replaces the previous MutationObserver-based approach,
        // which raced with MathJax 3's internal DOM bookkeeping and
        // could leave whole math blocks un-typeset.
        MathJax.startup.defaultReady();
        var origTypeset = MathJax.typesetPromise.bind(MathJax);
        MathJax.typesetPromise = function (els) {
          return origTypeset(els).then(function () {
            var roots = Array.isArray(els) ? els : (els ? [els] : [document.body]);
            roots.forEach(function (r) { window.glueOrphanPunctuation(r); });
          });
        };
        // Initial typeset of the page already includes the glue pass
        // because the default startup typeset goes through the wrapped
        // function above (MathJax 3 calls typesetPromise internally).
      }
    }
  };
</script>

<script>window.PROBLEMS_LATEX = {"1": {"latex": "Izraz $\\dfrac{(a^{3})^{2}}{a^{8}}$ zapišite v obliki $a^{m}$, kjer je $m$ celo število.", "tikz_count": 0}, "2": {"latex": "Rešite enačbo $\\;2\\cdot\\left(\\dfrac{1}{3}\\right)^{x}=54.$", "tikz_count": 0}, "3": {"latex": "Naj bo $z=4-i$. Z računom pokažite, da je število\n$\\;w=\\dfrac{1}{4}\\overline{z}-\\dfrac{3}{4}z\\;$\nenako $w=-2+i$. Število $w$ predstavite v kompleksni ravnini.", "tikz_count": 0}, "4": {"latex": "Izračunajte abscisi presečišč premice $y=2x$ in krožnice $x^{2}+y^{2}=5$.", "tikz_count": 0}, "5": {"latex": "Na skici spodaj je štirikotnik $ABCD$. Izračunajte kota $\\beta$ in $\\gamma$, če je $\\gamma=2\\beta$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.0,>=latex]\n  \\coordinate (A) at (0,0);\n  \\coordinate (B) at (5.4,0);\n  \\coordinate (C) at (4.6,2.6);\n  \\coordinate (D) at (1.6,3.0);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- cycle;\n  \\node[below left]  at (A) {$A$};\n  \\node[below right] at (B) {$B$};\n  \\node[above right] at (C) {$C$};\n  \\node[above left]  at (D) {$D$};\n  \\pic [draw, \"$70^\\circ$\", angle radius=8mm, angle eccentricity=1.45]\n       {angle = B--A--D};\n  \\pic [draw, \"$\\beta$\", angle radius=8mm, angle eccentricity=1.6]\n       {angle = C--B--A};\n  \\pic [draw, \"$101^\\circ$\", angle radius=8mm, angle eccentricity=1.6]\n       {angle = D--C--B};\n  \\pic [draw, \"$\\gamma$\", angle radius=8mm, angle eccentricity=1.55]\n       {angle = A--D--C};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Spomladanski_Pola1_OR_prob05_fig1.png"]}, "6": {"latex": "Izračunajte nedoločeni integral $\\displaystyle\\int\\!\\bigl(4+x^{2}+\\sin x\\bigr)\\,\\mathrm{d}x$.", "tikz_count": 0}, "7": {"latex": "Izračunajte površino enakostraničnega valja s polmerom osnovne ploskve $r=3$.", "tikz_count": 0}, "8": {"latex": "Izračunajte ploščino osenčenega lika na sliki.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.9,>=latex]\n  \\draw[gray!40] (0,0) grid (5,4);\n  \\draw[->] (0,0) -- (5.4,0);\n  \\draw[->] (0,0) -- (0,4.4);\n  \\foreach \\x in {0,1,2,3,4,5} \\node[below] at (\\x,0) {\\x};\n  \\foreach \\y in {1,2,3,4} \\node[left] at (0,\\y) {\\y};\n  \\filldraw[fill=gray!40, draw=black, thick]\n    (0,3) -- (4,4) -- (5,2) -- (2,0) -- cycle;\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Spomladanski_Pola1_OR_prob08_fig1.png"]}, "9": {"latex": "Naj bo $A$ množica vseh praštevil, manjših od $20$, $B$ množica vseh deliteljev števila $12$ in $C$ množica vseh večkratnikov števila $3$, manjših od $20$.\nZapišite množice $A$, $B$, $C$, $A\\cap B$ in $B\\cup C$.", "tikz_count": 0}, "10": {"latex": "Izračunajte diskriminante in poiščite vse rešitve kvadratnih enačb. Rezultate zapišite v preglednico.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.6}\n\\begin{tabular}{|c|c|c|}\n\\hline\n\\textbf{Enačba} & \\textbf{Diskriminanta} & \\textbf{Rešitve enačbe}\\\\\n\\hline\n$x^{2}-6x+9=0$    & & \\\\\n\\hline\n$x^{2}-3x-10=0$   & & \\\\\n\\hline\n$x^{2}-6x+10=0$   & & \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0}, "11": {"latex": "Na sliki je narisana krožnica s središčem v izhodišču koordinatnega sistema in polmerom $1$.\nTočki $A$ in $B$ ležita na krožnici, točka $A'$ je pravokotna projekcija točke $A$ na abscisno os, točka $C$ pa izhodišče koordinatnega sistema.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=2.4,>=latex]\n  \\draw[->] (-1.25,0) -- (1.3,0) node[right] {$x$};\n  \\draw[->] (0,-1.25) -- (0,1.3) node[above] {$y$};\n  \\draw (0,0) circle (1);\n  \\node[below] at (1,0)  {$1$};\n  \\node[below] at (-1,0) {$-1$};\n  \\node[left]  at (0,1)  {$1$};\n  \\node[left]  at (0,-1) {$-1$};\n  \\coordinate (A) at (-0.866,0.5);\n  \\coordinate (Ap) at (-0.866,0);\n  \\coordinate (C)  at (0,0);\n  \\coordinate (B)  at (0.5,-0.866);\n  \\coordinate (Xax) at (1,0);\n  \\fill (A) circle (0.6pt);\n  \\fill (Ap) circle (0.6pt);\n  \\fill (B) circle (0.6pt);\n  \\node[above left=-1pt] at (A) {$A\\!\\left(-\\tfrac{\\sqrt{3}}{2},\\,\\tfrac{1}{2}\\right)$};\n  \\node[below left] at (Ap) {$A'$};\n  \\node[above right=-1pt] at (C) {$C(0,0)$};\n  \\node[below right] at (B) {$B(x_{1},\\,y_{1})$};\n  \\node[anchor=west] at (0.18,-0.18) {\\small$\\alpha\\!=\\!60^\\circ$};\n  \\draw (A) -- (C) -- (B);\n  \\draw (A) -- (Ap);\n  \\pic [draw, angle radius=4mm] {angle = Xax--C--B};\n\\end{tikzpicture}\n\\end{center}\n\nIzračunajte natančni vrednosti neznanih koordinat $x_{1}$ in $y_{1}$ točke $B$ na sliki.\\\\\nNatančno izračunajte obseg in ploščino trikotnika $\\triangle CAA'$.", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Spomladanski_Pola1_OR_prob11_fig1.png"]}, "12": {"latex": "Naj bosta $a=\\log_{5} 2$ in $b=\\log_{5} 3$. Logaritme $\\log_{5} 6$, $\\log_{5} 2\\sqrt{3}$ in $\\log_{5} 0{,}\\overline{3}$ izrazite z $a$ in $b$.", "tikz_count": 0}, "13": {"latex": "Dana je funkcija $f(x)=\\dfrac{x^{2}}{x-2}$. Izračunajte stacionarni točki funkcije $f$. Zapišite enačbo tangente na graf funkcije $f$ v točki z absciso $-2$.", "tikz_count": 0}, "14": {"latex": "Premica z enačbo $y=2x$ je asimptota hiperbole s središčem v točki $S(0,0)$. Gorišči hiperbole ležita na abscisni osi, točka $A\\!\\left(\\sqrt{6},\\,2\\sqrt{3}\\right)$ pa leži na hiperboli.\n\n\\begin{itemize}[leftmargin=2em,itemsep=2pt,topsep=2pt]\n  \\item Zapišite enačbo hiperbole.\n  \\item Dano hiperbolo prezrcalimo preko simetrale lihih kvadrantov. Zapišite enačbo prezrcaljene hiperbole.\n\\end{itemize}", "tikz_count": 0}, "15": {"latex": "Na sliki sta narisana vektorja $\\vec{a}$ in $\\vec{b}$. Lik $ABCDEF$ je pravilni šestkotnik s stranicami dolžine ena. Točka $T$ je razpolovišče daljice $DE$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.1,>=latex]\n  \\coordinate (A) at (-1,0);\n  \\coordinate (B) at (1,0);\n  \\coordinate (C) at (2,1.732);\n  \\coordinate (D) at (1,3.464);\n  \\coordinate (E) at (-1,3.464);\n  \\coordinate (F) at (-2,1.732);\n  \\coordinate (T) at (0,3.464);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- (E) -- (F) -- cycle;\n  \\node[below left]  at (A) {$A$};\n  \\node[below right] at (B) {$B$};\n  \\node[right]       at (C) {$C$};\n  \\node[above right] at (D) {$D$};\n  \\node[above]       at (T) {$T$};\n  \\node[above left]  at (E) {$E$};\n  \\node[left]        at (F) {$F$};\n  \\fill (T) circle (1pt);\n  \\draw[->,thick] (A) -- node[below] {$\\vec{a}$} (B);\n  \\draw[->,thick] (B) -- node[right] {$\\vec{b}$} (C);\n\\end{tikzpicture}\n\\end{center}\n\n\\textit{1.}\\quad Izrazite vektorja $\\vec{AC}$ in $\\vec{BT}$ kot linearni kombinaciji vektorjev $\\vec{a}$ in $\\vec{b}$ ter izračunajte dolžino daljice $|BT|$.\n\n\\textit{2.}\\quad Daljici $AC$ in $BT$ se sekata v točki $U$. Izračunajte razmerje $|AU|:|UC|$.\n\n\\textit{3.}\\quad Naj bosta $\\vec{u}=\\vec{a}+\\vec{b}$ in $\\vec{w}=2\\vec{b}-\\dfrac{3}{2}\\vec{a}$. Vektor $\\dfrac{7}{2}\\vec{a}-\\dfrac{7}{2}\\vec{b}$ izrazite kot linearno kombinacijo vektorjev $\\vec{u}$ in $\\vec{w}$.", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Spomladanski_Pola1_VR_prob07_fig1.png"]}, "16": {"latex": "Funkcija $f$ je podana s predpisom\n\\[\nf(x)=\\begin{cases}\n-\\sqrt{-x^{2}+4x}\\,, & 0\\le x<4,\\\\\n3x-12, & 4\\le x\\le 5,\\\\\n-3x+18, & 5\\le x\\le 6.\n\\end{cases}\n\\]\nV spodnjem koordinatnem sistemu je narisan njen graf.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-0.7,0) -- (7.2,0) node[below right] {$x$};\n  \\draw[->] (0,-2.7) -- (0,3.7) node[left] {$y$};\n  \\foreach \\x in {1,2,3,4,5,6}\n    \\draw (\\x,0.08) -- (\\x,-0.08) node[below] {\\x};\n  \\foreach \\y/\\lab in {-2/$-2$, -1/$-1$, 1/{$1$}, 2/{$2$}, 3/{$3$}}\n    \\draw (0.08,\\y) -- (-0.08,\\y) node[left] {\\lab};\n  \\draw[thick,domain=180:360,smooth,variable=\\t]\n    plot ({2+2*cos(\\t)},{2*sin(\\t)});\n  \\draw[thick] (4,0) -- (5,3) -- (6,0);\n  \\foreach \\p in {(0,0),(4,0),(5,3),(6,0)} \\fill \\p circle (1.8pt);\n  \\nod c|}\n\\hline\n\\textbf{Funkcijski predpis} & \\multicolumn{4}{c|}{\\textbf{Lastnost funkcije}}\\\\\n\\hline\n$f(x)=x^{2}\\sin x$ & soda & \\fbox{liha} & naraščajoča & padajoča\\\\\n\\hline\n$g(x)=2^{-x}$     & soda & liha & naraščajoča & padajoča\\\\\n\\hline\n$h(x)=\\cos x$     & soda & liha & naraščajoča & padajoča\\\\\n\\hline\n$t(x)=\\log_{2} x$ & soda & liha & naraščajoča & padajoča\\\\\n\\hline\n$u(x)=|x|-1$      & soda & liha & naraščajoča & padajoča\\\\\n\\hline\n$v(x)=x+\\cos x$   & soda & liha & naraščajoča & padajoča\\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0}, "30": {"latex": "V koordinatnem sistemu je narisana krivulja z enačbo $y=x^{3}+a$. Označeni območji $A$ in $B$ v pravokotniku imata enako ploščino. Izračunajte $a$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.7,>=latex]\n  % unit square (the rectangle in question)\n  \\fill[gray!55] (0,0) rectangle (1,1);\n  % darker region A (between curve and top of square, above curve)\n  \\fill[gray!85,domain=0:1,smooth,variable=\\x]\n    plot (\\x,{\\x*\\x*\\x+0.5}) -- (1,1) -- (0,1) -- cycle;\n  \\draw[thick] (0,0) rectangle (1,1);\n  % axes\n  \\draw[->] (-1.1,0) -- (1.6,0) node[right] {$x$};\n  \\draw[->] (0,-1.1) -- (0,1.5) node[above] {$y$};\n  % curve y = x^3 + 0.5 (illustrative shift for the picture)\n  \\draw[thick,smooth,domain=-0.95:1.05,samples=60]\n    plot (\\x,{\\x*\\x*\\x+0.5});\n  \\draw (1,0.04) -- (1,-0.04) node[below] {$1$};\n  \\draw (0.04,1) -- (-0.04,1) node[left] {$1$};\n  \\node[below left] at (0,0) {$0$};\n  \\node at (0.45,0.82) {$A$};\n  \\node at (0.68,0.25) {$B$};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Spomladanski_Pola2_OR_prob14_fig1.png"]}, "31": {"latex": "Vektorja $\\vec{a}$ in $\\vec{b}$ na spodnji sliki sta dolga $4$ enote, kot med njima pa je $120^\\circ$.\nSkicirajte vektor $\\vec{c}=-2\\vec{a}+\\dfrac{1}{2}\\vec{b}$ ter izračunajte skalarna produkta $\\vec{a}\\cdot\\vec{b}$ in $\\vec{a}\\cdot\\vec{c}$.", "tikz_count": 0}, "32": {"latex": "Dani sta zaporedji s splošnima členoma $a_{n}=\\sqrt{4n^{2}-n}$ in $b_{n}=2n$.\n\n\\textit{1.}\\quad Koliko členov zaporedja s splošnim členom $c_{n}=\\dfrac{1}{a_{n}}$ je večjih od $0{,}01$?\n\n\\textit{2.}\\quad Izračunajte limito zaporedja s splošnim členom $d_{n}=a_{n}-b_{n}$.\n\n\\textit{3.}\\quad Dokažite, da je zaporedje s splošnim členom $g_{n}=\\dfrac{b_{n}}{a_{n}^{2}}$ padajoče. Določite natančno spodnjo in natančno zgornjo mejo tega zaporedja.", "tikz_count": 0}, "33": {"latex": "\\textit{1.}\\quad Na igrišču z obsegom $400\\,\\mathrm{m}$ začneta tekača hkrati teči iz iste točke ob zunanjem robu igrišča. Prvi teče v pozitivno smer s konstantno hitrostjo $v_{1}=2\\,\\mathrm{m\\,s^{-1}}$, drugi pa v negativno smer s konstantno hitrostjo $v_{2}=3\\,\\mathrm{m\\,s^{-1}}$. Kolikokrat se bosta srečala tekača, če tečeta $10$ minut?\n\n\\textit{2.}\\quad Načrtujemo gradnjo športnega igrišča, ki ima obliko, kot je prikazana na sliki. Ploščina osrednjega dela igrišča, pravokotnika $ABCD$, meri $6000\\,\\mathrm{m^{2}}$, krajši stranici pravokotnika pa zaključujeta polkroga. Kolikšna mora biti dolžina ravnega dela igrišča $x=|AB|$, da bo tekač, ko preteče en krog ob zunanjem robu igrišča, pretekel najkrajšo možno razdaljo?\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.8,>=latex]\n  % pravokotnik ABCD: A=(0,0), B=(6,0), C=(6,3), D=(0,3)\n  \\fill[gray!55] (0,0) rectangle (6,3);\n  \\draw[thick] (0,0) -- (6,0);\n  \\draw[thick] (0,0) -- (0,3);\n  \\draw[thick] (6,0) -- (6,3);\n  \\draw[thick] (0,3) -- (6,3);\n  % left semicircle\n  \\draw[thick] (0,3) arc (90:270:1.5);\n  % right semicircle\n  \\draw[thick] (6,0) arc (-90:90:1.5);\n  \\fill (0,0) circle (1.6pt) node[below left] {$A$};\n  \\fill (6,0) circle (1.6pt) node[below right] {$B$};\n  \\fill (6,3) circle (1.6pt) node[above right] {$C$};\n  \\fill (0,3) circle (1.6pt) node[above left] {$D$};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Spomladanski_Pola2_VR_prob11_fig1.png"]}, "34": {"latex": "Razstavite dana izraza.\n\\begin{align*}\n2x^{5}-8x^{3} &= \\\\\nx^{2}-2x-24   &=\n\\end{align*}", "tikz_count": 0}, "35": {"latex": "Premici $y=5x+2$ in $y=-x+3$ se sekata v točki $T$. Izračunajte koordinati točke $T$.", "tikz_count": 0}, "36": {"latex": "Dano je kompleksno število $z=1-2i$. Izračunajte $\\overline{z}$ in $z^{2}$.", "tikz_count": 0}, "37": {"latex": "Rešite enačbo $\\log_{3}(2x+1)=2$.", "tikz_count": 0}, "38": {"latex": "Polinom $p$ je dan s predpisom $p(x)=-3(x-1)^{2}(x+2)$. V preglednici ob trditvi obkrožite \\textbf{DA}, če trditev drži, oziroma \\textbf{NE}, če trditev ne drži.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.4}\n\\begin{tabular}{|l|c|c|}\n\\hline\nVodilni koeficient polinoma je enak $-3$. & DA & NE \\\\\n\\hline\n$x=-1$ je ničla polinoma $p$. & DA & NE \\\\\n\\hline\nProsti člen (konstantni člen) polinoma $p$ je enak $-6$. & DA & NE \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0}, "39": {"latex": "Na sliki je narisana elipsa s središčem v izhodišču koordinatnega sistema. Zapišite njeno enačbo.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.75,>=latex]\n  \\draw[->] (-3.7,0) -- (3.8,0) node[right] {$x$};\n  \\draw[->] (0,-2.6) -- (0,2.7) node[above] {$y$};\n  \\draw (1,0.07) -- (1,-0.07) node[below] {$1$};\n  \\draw (0.07,1) -- (-0.07,1) node[left] {$1$};\n  \\node[below left] at (0,0) {$0$};\n  \\draw[thick] (0,0) ellipse [x radius=3, y radius=2];\n  \\foreach \\p in {(3,0),(-3,0),(0,2),(0,-2)} \\fill \\p circle (1.5pt);\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Jesenski_Pola1_OR_prob06_fig1.png"]}, "40": {"latex": "Eksponentna funkcija $f$ je podana s predpisom $f(x)=\\bigl(\\sqrt{3}\\bigr)^{x}$. Točka $A(x_{0},\\,9)$ leži na grafu funkcije $f$. Izračunajte njeno absciso.", "tikz_count": 0}, "41": {"latex": "Dano je zaporedje $-2,\\;4,\\;a_{3},\\;16$.\n\nDoločite manjkajoči člen $a_{3}$ tako, da bo zaporedje aritmetično.\n\\[a_{3}=\\rule{4cm}{0.4pt}\\]\nDoločite manjkajoči člen $a_{3}$ tako, da bo zaporedje geometrijsko.\n\\[a_{3}=\\rule{4cm}{0.4pt}\\]", "tikz_count": 0}, "42": {"latex": "Linearna funkcija $f$ je dana s predpisom $f(x)=-\\dfrac{1}{2}x+4$.\n\nIzračunajte začetno vrednost funkcije $f$ in ničlo funkcije $f$. Narišite graf funkcije $f$.\\\\\nZapišite enačbo premice, ki je pravokotna na graf dane funkcije $f$ in gre skozi točko $A(1,\\,-4)$.", "tikz_count": 0}, "43": {"latex": "Izračunajte $\\sqrt[3]{a\\cdot\\sqrt{a\\cdot b^{3}}}\\;:\\;\\sqrt[4]{a\\cdot b^{5}}$.\n\nRezultat zapišite v obliki $\\sqrt[k]{a^{m}b^{n}}$, $k,m,n\\in\\mathbb{Z}$, kjer so $k,m,n$ paroma tuja števila.", "tikz_count": 0}, "44": {"latex": "V pravokotnem koordinatnem sistemu v ravnini sta narisana vektor $\\overrightarrow{AB}$ in točka $C$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[help lines,gray!40] (-4,-2) grid (6,6);\n  \\draw[->] (-4,0) -- (6.3,0) node[right] {$x$};\n  \\draw[->] (0,-2) -- (0,6.3) node[above] {$y$};\n  \\draw (1,0.1) -- (1,-0.1) node[below] {$1$};\n  \\draw (0.1,1) -- (-0.1,1) node[left] {$1$};\n  \\node[below left] at (0,0) {$0$};\n  \\draw[thick,->] (2,2) -- (5,5);\n  \\fill (2,2) circle (2pt) node[below right] {$A$};\n  \\fill (5,5) circle (2pt) node[above right] {$B$};\n  \\fill (-2,-1) circle (2pt) node[below left] {$C$};\n\\end{tikzpicture}\n\\end{center}\n\nZapišite vektor $\\overrightarrow{AB}$ s koordinatama (komponentama) in izračunajte dolžino vektorja $\\overrightarrow{AB}$.\\\\\nZapišite točko $D$, za katero velja $\\overrightarrow{CD}=2\\,\\overrightarrow{AB}$. V dani pravokotni koordinatni sistem narišite vektor $\\overrightarrow{CD}$.", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Jesenski_Pola1_OR_prob11_fig1.png"]}, "45": {"latex": "Naj bo $x>0$ in $\\log_{a} x^{2}=7$. Izračunajte vrednost izraza $\\log_{a}\\dfrac{a^{2}}{x}$.", "tikz_count": 0}, "46": {"latex": "Izračunajte prvi člen in količnik naraščajočega geometrijskega zaporedja, če je $a_{2}+a_{3}=12$ in $a_{4}-a_{3}=18$. Zapišite prve štiri člene tega geometrijskega zaporedja.", "tikz_count": 0}, "47": {"latex": "Rešite nalogi:\n\n\\textit{1.}\\quad Kvadratna funkcija $f$ je dana s predpisom $f(x)=-2x^{2}-8x+2$. Izračunajte ničli funkcije $f$ in točko, v kateri funkcija doseže maksimum. Določite zalogo vrednosti.\n\n\\textit{2.}\\quad Izračunajte realno število $b$, da bo imela funkcija $g(x)=-x^{2}+bx+2024$ največjo vrednost pri $x=-2$.", "tikz_count": 0}, "48": {"latex": "Funkcija $f$ je dana s predpisom $f(x)=\\dfrac{20}{x^{2}+4}-1$.\n\n\\textit{1.}\\quad Za funkcijo $f$ izračunajte ničli, zapišite enačbo vodoravne asimptote njenega grafa in koordinati točke na grafu, v kateri doseže lokalni maksimum. V koordinatni sistem narišite graf funkcije $f$.\n\n\\textit{2.}\\quad Naj bo funkcija $g$ dana s predpisom $g(x)=\\sqrt{f(x)}$. Zapišite definicijsko območje in zalogo vrednosti funkcije $g$.\n\n\\textit{3.}\\quad Računsko dokažite, da je ploščina lika, ki ga omejujejo abscisna os, premici $x=0$ in $x=2$ ter graf funkcije $f$, enaka $\\dfrac{5\\pi}{2}-2$.", "tikz_count": 0}, "49": {"latex": "V ravnini je dana parabola z enačbo $y^{2}+4x+4=0$.\n\n\\textit{1.}\\quad Za dano parabolo zapišite teme in enačbo tiste tangente, ki je pravokotna na premico $4x-y=0$.\n\n\\textit{2.}\\quad Preverite, ali se dana parabola in krivulja $x^{2}-y^{2}-4x+3=0$ sekata. Odgovor utemeljite.\n\n\\textit{3.}\\quad Enačba $4x^{2}+By^{2}-16x+12=0$, $B\\in\\mathbb{R}$, predstavlja hiperbolo z imaginarno polosjo $2$. Izračunajte $B$.", "tikz_count": 0}, "50": {"latex": "Dani sta množici $\\mathcal{A}=\\{1,\\,2,\\,3,\\,4,\\,5\\}$ in $\\mathcal{B}=\\{n\\in\\mathbb{N};\\ 2\\le n<5\\}$. Z naštevanjem elementov zapišite množici $\\mathcal{B}$ in $\\mathcal{A}\\setminus\\mathcal{B}$.", "tikz_count": 0}, "51": {"latex": "V trikotniku $\\triangle ABC$ velja $\\alpha=48{,}6^\\circ$ in $\\gamma=2\\beta$. Izračunajte velikost kota $\\beta$.", "tikz_count": 0}, "52": {"latex": "Števili $a$ in $b$ sta v razmerju $a:b=2:3$, njuna vsota pa je enaka $17{,}5$. Izračunajte števili $a$ in $b$.", "tikz_count": 0}, "53": {"latex": "Prvotna cena izdelka je bila $120\\,\\text{€}$. Trgovina je najprej podražila izdelek za $5\\,\\%$, potem pa je objavila akcijski popust v višini $10\\,\\%$. Izračunajte novo ceno izdelka.", "tikz_count": 0}, "54": {"latex": "V trikotniku $\\triangle ABC$ na sliki je $ED\\parallel BC$, $|BC|=12\\,\\mathrm{cm}$, $|AB|=7\\,\\mathrm{cm}$, $|ED|=3\\,\\mathrm{cm}$. Izračunajte dolžino daljice $EB$. (Slika ni narisana v merilu.)\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  % triangle ABC: A=(0,0), B=(8,0), C=(1,7)\n  \\coordinate (A) at (0,0);\n  \\coordinate (B) at (8,0);\n  \\coordinate (C) at (1,7);\n  \\draw[thick] (A) -- (B) -- (C) -- cycle;\n  % ED parallel to BC, with E on AB and D on AC; pick parameter t = 0.3\n  \\coordinate (E) at (2.4,0);\n  \\coordinate (D) at (0.3,2.1);\n  \\draw[thick] (E) -- (D);\n  \\fill (A) circle (2pt) node[below] {$A$};\n  \\fill (B) circle (2pt) node[below right] {$B$};\n  \\fill (C) circle (2pt) node[above left] {$C$};\n  \\fill (E) circle (2pt) node[below] {$E$};\n  \\fill (D) circle (2pt) node[left] {$D$};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Jesenski_Pola2_OR_prob05_fig1.png"]}, "55": {"latex": "Izračunajte odvod\n\\[\n\\bigl(x^{-1}+\\sin x+\\ln x\\bigr)'=\\rule{4cm}{0.4pt}\n\\]", "tikz_count": 0}, "56": {"latex": "Povprečna cena bencina v prvih sedmih dneh novembra $2022$ je bila $1{,}430\\,\\text{€}$, naslednjih $14$ dni je bila $1{,}482\\,\\text{€}$, nato pa do konca meseca ($9$ dni) $1{,}464\\,\\text{€}$. Izračunajte povprečno ceno bencina v novembru $2022$.", "tikz_count": 0}, "57": {"latex": "Koliko štirimestnih števil večjih od $2024$ in manjših od $5000$ lahko sestavimo s števkami $2,\\,4,\\,6$ in $8$, če lahko vsako števko uporabimo večkrat?", "tikz_count": 0}, "58": {"latex": "Plašč enakostraničnega pokončnega valja meri $36\\pi$. Izračunajte prostornino tega valja. Rezultat zaokrožite na dve decimalki.", "tikz_count": 0}, "59": {"latex": "V trapezu $ABCD$ na sliki je $BC\\parallel ED$, $EC\\perp AB$, $|EC|:|EB|=2:1$, $|AB|=7\\,\\mathrm{cm}$ in $|CD|=2\\,\\mathrm{cm}$. Izračunajte notranji kot pri oglišču $B$, dolžino stranice $BC$ in ploščino trapeza $ABCD$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.75,>=latex]\n  \\coordinate (A) at (-5,0);\n  \\coordinate (B) at (2,0);\n  \\coordinate (C) at (0,4);\n  \\coordinate (D) at (-2,4);\n  \\coordinate (E) at (0,0);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- cycle;\n  \\draw[thick] (E) -- (C);\n  \\draw[thick] (E) -- (D);\n  % right angle mark at E\n  \\draw (0.3,0) -- (0.3,0.3) -- (0,0.3);\n  % angle beta at B between BA and BC\n  \\draw ([shift={(B)}]180:0.75) arc (180:117:0.75);\n  \\node at ($(B) + (148:0.55)$) {$\\beta$};\n  \\fill (A) circle (1.8pt) node[below] {$A$};\n  \\fill (B) circle (1.8pt) node[below] {$B$};\n  \\fill (C) circle (1.8pt) node[above right] {$C$};\n  \\fill (D) circle (1.8pt) node[above left] {$D$};\n  \\fill (E) circle (1.8pt) node[below] {$E$};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Jesenski_Pola2_OR_prob10_fig1.png"]}, "60": {"latex": "V majhnem podjetju je zaposlenih $8$ moških in $4$ ženske. Štirje od njih se bodo udeležili seminarja.\n\n\\textit{1.}\\quad Na koliko načinov lahko izberejo udeležence seminarja, da bo zastopanost spolov enaka?\n\n\\textit{2.}\\quad Na koliko načinov lahko izberejo udeležence seminarja, če se mora seminarja udeležiti več moških kakor žensk?\n\n\\textit{3.}\\quad Kolikšna je verjetnost, da bodo v naključno izbrani delegaciji vsi štirje udeleženci istega spola?", "tikz_count": 0}, "61": {"latex": "Dana je funkcija $f(x)=2\\sin\\!\\left(\\dfrac{x}{2}+\\dfrac{\\pi}{6}\\right)-2$. Zapišite presečišče grafa funkcije $f$ z ordinatno osjo in izračunajte ničle te funkcije.", "tikz_count": 0}, "62": {"latex": "Naj bo $F'(x)=x^{3}-3\\mathrm{e}^{x}-\\dfrac{\\sin x}{3}$ in $F(0)=\\dfrac{1}{3}$. Izračunajte $F(x)$.", "tikz_count": 0}, "63": {"latex": "V tretjem letniku gimnazije je razmerje med številom fantov in številom deklet $2:3$. Junija so vsi dijaki in dijakinje tega letnika razen desetih deklet odšli na strokovno ekskurzijo v Grčijo. V hotelu so dijakinje in dijaki zasedli $40$ sob, ki so bile bodisi triposteljne bodisi štiriposteljne. Fantje so zasedli vse triposteljne sobe in dekleta so zasedla vse štiriposteljne sobe. Vse postelje so bile zasedene.\n\nKoliko dijakov (fantov in deklet skupaj) je v tem letniku?\\\\\nKoliko triposteljnih sob je bilo namenjenih za fante iz tega letnika?", "tikz_count": 0}, "64": {"latex": "Dani sta kompleksni števili $z=2$ in $w=1+\\sqrt{3}\\,i$.\n\n\\textit{1.}\\quad Pokažite, da kompleksna števila $z,\\,w,\\,-z,\\,-w,\\,\\overline{w}$ in $-\\overline{w}$ ležijo na krožnici s središčem v izhodišču koordinatnega sistema in polmerom $2$.\n\n\\textit{2.}\\quad Določite tako kompleksno število $u=a+b\\,i$ ($a,b\\in\\mathbb{R}$), da bo $\\operatorname{Re}\\!\\left(\\dfrac{u}{\\overline{w}}\\right)=z\\sqrt{3}$ in $\\operatorname{Im}\\!\\left(\\dfrac{u}{\\overline{w}}\\right)=-z$.\n\n\\textit{3.}\\quad Z matematično indukcijo pokažite, da je $w^{3n}=(-1)^{n}\\cdot 2^{3n}$ za vsako naravno število $n$.", "tikz_count": 0}, "65": {"latex": "Na spodnji sliki je skica tlorisa stanovanja, katerega prodajna cena je $140\\,000\\,$\\textnormal{€}.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.5, every node/.style={font=\\small}]\n  % Light 1m grid\n  \\draw[gray!25, very thin] (-0.5,-0.5) grid (10.5,8.5);\n  % Apartment outer wall — L-shape with a small notch on the left.\n  \\draw[ultra thick]\n    (2,7) -- (10,7) -- (10,0) -- (5,0) -- (5,2) -- (2,2) -- (2,4)\n       -- (1.5,4) -- (1.5,5) -- (2,5) -- cycle;\n  % Internal walls — the wall segments stop at door openings, so we\n  % draw them in pieces rather than as continuous lines.\n  \\draw[thick] (6,7)   -- (6,4);                 % kuhinja | soba 1\n  \\draw[thick] (2,4)   -- (4,4);                 % top of hodnik/kopalnica row\n  \\draw[thick] (5.5,4) -- (10,4);                % top of kopalnica\n  \\draw[thick] (5,4)   -- (5,2);                 % hodnik | soba 2 (upper)\n  \\draw[thick] (4,4)   -- (4,2);                 % hodnik left wall\n  \\draw[thick] (4,3)   -- (5,3);                 % bottom of kopalnica/top of hodnik step\n  \\draw[thick] (5,3)   -- (10,3);                % kopalnica | soba 2\n  % Room labels\n  \\node at (3.7, 5.6) {kuhinja in};\n  \\node at (3.7, 5.0) {dnevna soba};\n  \\node at (8,   5.5) {soba 1};\n  \\node at (7.5, 3.5) {kopalnica};\n  \\node at (4.5, 3.0) {hodnik};\n  \\node at (7.5, 1.5) {soba 2};\n  % Scale bar on the right\n  \\draw[thick] (11,5) -- (12,5);\n  \\draw[thick] (11,4.9) -- (11,5.1);\n  \\draw[thick] (12,4.9) -- (12,5.1);\n  \\node[right] at (11.9, 5.5) {merilo:};\n  \\node[right] at (11.9, 4.5) {$1\\,\\mathrm{m}$};\n\\end{tikzpicture}\n\\end{center}\n\n\\textit{1.}\\quad Izračunajte, koliko stane $\\mathrm{m}^{2}$ tega stanovanja. (Debelino sten zanemarimo.)\n\n\\textit{2.}\\quad Andrej je želel kupiti to stanovanje, vendar je imel privarčevanih le $135\\,000\\,$\\textnormal{€}. Privarčevani denar je zato vložil v banko, ki uporablja letno obrestno mero $0{,}8\\,\\%$ in obrestno obrestovanje z letnim pripisom obresti. Ali bo v petih letih dobil dovolj obresti, da si bo lahko s tem denarjem kupil stanovanje, vredno $140\\,000\\,$\\textnormal{€}, če medtem na banko ne bo nič vlagal in z banke ne bo nič dvigoval? Odgovor utemeljite z računom.\n\n\\textit{3.}\\quad Jure se je odločil za nakup tega stanovanja. Privarčevanih ima $100\\,000\\,$\\textnormal{€}. Razliko do $140\\,000\\,$\\textnormal{€} bo plačal s posojilom. Posojilo bo vzel pri banki, ki uporablja letno obrestno mero $1{,}2\\,\\%$ in relativno obrestno obrestovanje z mesečnim pripisom obresti. Izposojeni znesek bo vrnil v enakih mesečnih obrokih v petih letih po zadolžitvi, prvi obrok pa bo plačal en mesec po najemu posojila. Koliko bo Jure na mesec plačeval banki?", "tikz_count": 1, "tikz_originals": ["matura_figures/2025_Jesenski_Pola2_VR_prob10_fig1.png"]}, "66": {"latex": "V levem stolpcu preglednice je opis množice. V desni stolpec preglednice vpišite njeno moč.\n\n\\begin{center}\n\\begin{tabular}{|p{8cm}|p{3cm}|}\n\\hline\nOpis množice & Moč množice \\\\\n\\hline\nMnožica $A$ je množica vseh sodih naravnih števil, manjših od $7$. & \\\\\n\\hline\nMnožica $B$ je množica vseh diagonal v pravilnem petkotniku. & \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_01.png?v=feae2d"}, "67": {"latex": "Rešite enačbo $3|x+3|=2|x+3|+8$.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_02.png?v=1163f6"}, "68": {"latex": "V skupini je $6$ fantov in $3$ deklice. Povprečna starost fantov je $10$ let, povprečna starost deklic pa $7$ let. Kolikšna je povprečna starost te skupine otrok?", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_03.png?v=af2176"}, "69": {"latex": "Naj bo $\\alpha$ oster kot in naj velja $\\sin\\alpha=\\dfrac{1}{4}$. Izračunajte $\\cos\\alpha$ in $\\tan\\alpha$.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_04.png?v=741ab3"}, "70": {"latex": "Zapišite teme kvadratne funkcije $f(x)=4x^{2}-4x+4$.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_05.png?v=c689e7"}, "71": {"latex": "Rešite enačbo $\\log_{x}32=5$.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_06.png?v=0eacd1"}, "72": {"latex": "Izračunajte odvod funkcije $f(x)=\\ln(2x+5)$.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_07.png?v=73e2b5"}, "73": {"latex": "V srednjem stolpcu tabele napišite znak $<$, $>$ ali $=$ tako, da bo v posamezni vrstici izjava pravilna.\n\n\\begin{center}\n\\begin{tabular}{|c|c|c|}\n\\hline\n & Znak & \\\\\n\\hline\n$1+\\dfrac{1}{4}$ & & $2-\\dfrac{4}{5}$ \\\\\n\\hline\n$\\sin 120^{\\circ}$ & & $\\sin 150^{\\circ}$ \\\\\n\\hline\n$\\binom{7}{3}$ & & $\\binom{7}{4}$ \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_08.png?v=1c7f60"}, "74": {"latex": "Dani so vektorji $\\vec{a}=(4,\\,-3,\\,1)$, $\\vec{b}=(-2,\\,5,\\,3)$ in $\\vec{c}=(x,\\,2,\\,4)$.\n\n\\textit{1.}\\quad Izračunajte $2\\vec{a}+\\vec{b}$.\n\n\\textit{2.}\\quad Izračunajte $\\vec{a}\\cdot\\vec{b}$.\n\n\\textit{3.}\\quad Izračunajte dolžino vektorja $\\vec{b}$.\n\n\\textit{4.}\\quad Določite $x$ tako, da bosta vektorja $\\vec{a}$ in $\\vec{c}$ pravokotna.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_09.png?v=cce5d2"}, "75": {"latex": "V preglednici določite pravilnost (resničnost) ali nepravilnost (neresničnost) izjav tako, da v posamezni vrstici obkrožite DA, če je izjava pravilna, ali NE, če izjava ni pravilna.\n\n\\begin{center}\n\\begin{tabular}{|c|c|c|}\n\\hline\nIzjava & \\multicolumn{2}{c|}{Pravilnost/nepravilnost izjave} \\\\\n\\hline\n$\\mathrm{i}^{2}=-1$ & DA & NE \\\\\n\\hline\n$|3-4\\mathrm{i}|=25$ & DA & NE \\\\\n\\hline\n$\\overline{3-4\\mathrm{i}}=3+4\\mathrm{i}$ & DA & NE \\\\\n\\hline\n$\\mathrm{i}^{2022}=-1$ & DA & NE \\\\\n\\hline\n$\\mathrm{Im}(3-4\\mathrm{i})=-4\\mathrm{i}$ & DA & NE \\\\\n\\hline\n$\\mathrm{Re}(3-4\\mathrm{i})=3$ & DA & NE \\\\\n\\hline\n$25(3-4\\mathrm{i})^{-1}=3+4\\mathrm{i}$ & DA & NE \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_10.png?v=9bb0e4"}, "76": {"latex": "Naj bosta $a$ in $b$ poljubni realni števili, $a>0$ in $b\\ne 0$. Vsak izraz v levem stolpcu preglednice je enak enemu izrazu v desnem stolpcu. Izrazi v desnem stolpcu so označeni s črkami od A do L.\n\nV preglednici v za to namenjen prostor vpišite črko izraza, ki je enak izrazu v levem stolpcu preglednice (prva vrstica je že izpolnjena).\n\n\\begin{center}\n\\begin{tabular}{|c|c|}\n\\hline\n$a^{0}$ & L \\\\\n\\hline\n$(ab^{2})^{2}$ & \\\\\n\\hline\n$(a+b^{2})^{2}$ & \\\\\n\\hline\n$(ab^{2}):(ab)^{3}$ & \\\\\n\\hline\n$\\sqrt{a}\\cdot\\sqrt[3]{ab}$ & \\\\\n\\hline\n$\\sqrt{b^{2}}$ & \\\\\n\\hline\n\\end{tabular}\n\\end{center}\n\n\\begin{itemize}[leftmargin=2em,itemsep=2pt,topsep=2pt]\n  \\item[(A)] $ab^{4}$\n  \\item[(B)] $b$\n  \\item[(C)] $|b|$\n  \\item[(D)] $a^{2}b^{4}$\n  \\item[(E)] $a^{-2}b^{-1}$\n  \\item[(F)] $a^{5/6}b^{1/3}$\n  \\item[(G)] $a^{2}+2ab^{2}+b^{4}$\n  \\item[(H)] $\\sqrt[5]{a^{5}b^{5}}$\n  \\item[(I)] $a^{2}+b^{4}$\n  \\item[(J)] $a^{-3}b^{-1}$\n  \\item[(K)] $-1$\n  \\item[(L)] $1$\n\\end{itemize}", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_11.png?v=ad27d2"}, "77": {"latex": "Rešite enačbo $\\log(15-x)+\\log(-x)=2$.", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_12.png?v=893a77"}, "78": {"latex": "Dana je funkcija s predpisom $f(x)=\\dfrac{2-x}{x+2}$.\n\n\\begin{itemize}[leftmargin=2em,itemsep=6pt,topsep=2pt]\n  \\item Zapišite definicijsko območje funkcije $f$.\n  \\item Zapišite enačbo vodoravne asimptote funkcije $f$.\n  \\item Poiščite predpis inverzne funkcije $f^{-1}$.\n  \\item Zapišite zalogo vrednosti funkcije $f$.\n\\end{itemize}", "tikz_count": 0, "body_image": "matura_refined/2023_Jesenski_Pola1_OR/prob_13.png?v=28c270"}, "79": {"latex": "Naj bo $a$ pozitivno realno število.\n\nV istem koordinatnem sistemu skicirajte graf funkcije $f(x)=e^{ax}$ in premico $y=e$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-3.5,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-3.5) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3}\n    \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3}\n    \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[bel
