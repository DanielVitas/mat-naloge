(x)\\,\\mathrm{d}x=\\rule{2cm}{0.4pt}$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Jesenski_Pola1_OR/prob_07.png?v=546b1f", "tikz_originals": ["matura_refined/2019_Jesenski_Pola1_OR/prob_07.png"]}, "399": {"latex": "Naj bo dana funkcija $f$ s predpisom $f(x)=x^4-x^2$.\n\n\\begin{enumerate}\n\\item Izračunajte vse ničle funkcije $f$.\n\\item Izračunajte odvod $f'$.\n\\item Izračunajte vse lokalne ekstreme funkcije $f$.\n\\item Narišite graf funkcije $f$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-4,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3} \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3} \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Jesenski_Pola1_OR/prob_08.png?v=f7022c", "tikz_originals": ["matura_refined/2019_Jesenski_Pola1_OR/prob_08.png"]}, "400": {"latex": "V ravnini je narisana elipsa s temeni $A(-2,\\,-1)$, $B(3,\\,-4)$, $C(8,\\,-1)$ in $D(3,\\,2)$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.45,>=latex]\n  \\draw[->] (-3,0) -- (10,0) node[right] {$x$};\n  \\draw[->] (0,-6) -- (0,4) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n  \\draw (1,-0.15) -- (1,0.15);\n  \\draw[thick] (3,-1) ellipse (5 and 3);\n  \\fill (-2,-1) circle (3pt);\n  \\fill (3,-4) circle (3pt);\n  \\fill (8,-1) circle (3pt);\n  \\fill (3,2) circle (3pt);\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{enumerate}\n\\item Zapišite enačbo narisane elipse.\n\\item Koliko je levo gorišče elipse oddaljeno od koordinatnega izhodišča? Nalogo rešite brez uporabe računala.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Jesenski_Pola1_OR/prob_09.png?v=40af6b", "tikz_originals": ["matura_refined/2019_Jesenski_Pola1_OR/prob_09.png"]}, "401": {"latex": "Imamo $6$ igralnih kock: rumeno, zeleno, modro, rdečo, belo in črno. V preglednici so opisani štirje poskusi in dogodki. Izračunajte verjetnosti dogodkov $A$, $B$, $C$ in $D$ ter rezultate zapišite v preglednico.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.8}\n\\begin{tabular}{|p{1cm}|p{8cm}|p{4cm}|}\n\\hline\n& Poskus in dogodek & Verjetnost dogodka\\\\\n\\hline\n$10.1.$ & Naključno izberemo eno izmed teh šestih igralnih kock. Dogodek $A$ -- Bela kocka ni izbrana. & $P(A)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\n$10.2.$ & Naključno izberemo dve izmed teh šestih igralnih kock. Dogodek $B$ -- Izbrani sta črna in bela kocka. & $P(B)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\n$10.3.$ & Vržemo modro igralno kocko. Dogodek $C$ -- Pade število, ki je manjše od $3$. & $P(C)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\n$10.4.$ & Vržemo rumeno in zeleno igralno kocko. Dogodek $D$ -- Padeta dve petici. & $P(D)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2019_Jesenski_Pola1_OR/prob_10.png?v=d163f4"}, "402": {"latex": "Izračunajte limito $\\displaystyle\\lim_{x\\to 0}\\dfrac{\\sin(x+\\pi)+3x}{4x}$.", "tikz_count": 0, "body_image": "matura_refined/2019_Jesenski_Pola1_OR/prob_11.png?v=5c6490"}, "403": {"latex": "Izračunajte vsoto ploščin vseh osenčenih likov v kvadratu s stranico dolžine $2$. Nalogo rešite brez uporabe računala. Osenčeni liki so dve polovici kroga s premerom $2$ in dva kroga. Kroga se dotikata obeh polkrogov in stranice kvadrata.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.4,>=latex]\n  \\fill[gray!40] (0,2) -- (2,2) arc[start angle=0,end angle=-180,radius=1] -- cycle;\n  \\fill[gray!40] (0,0) -- (2,0) arc[start angle=0,end angle=180,radius=1] -- cycle;\n  \\pgfmathsetmacro{\\rr}{3-2*sqrt(2)}\n  \\fill[gray!40] (\\rr,1) circle (\\rr);\n  \\fill[gray!40] ({2-\\rr},1) circle (\\rr);\n  \\draw[thick] (0,0) rectangle (2,2);\n  \\draw[thick] (0,2) arc[start angle=180,end angle=360,radius=1];\n  \\draw[thick] (0,0) arc[start angle=180,end angle=0,radius=1];\n  \\draw[thick] (\\rr,1) circle (\\rr);\n  \\draw[thick] ({2-\\rr},1) circle (\\rr);\n  \\draw[<->] (2.25,0) -- (2.25,2);\n  \\node[right] at (2.25,1) {$2$};\n  \\draw[<->] (0,-0.25) -- (2,-0.25);\n  \\node[below] at (1,-0.25) {$2$};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "body_image": "matura_refined/2019_Jesenski_Pola1_OR/prob_12.png?v=e7297c", "tikz_originals": ["matura_refined/2019_Jesenski_Pola1_OR/prob_12.png"]}, "404": {"latex": "Bazen začnemo polniti z vodo. Ob začetku polnjenja je voda v bazenu že segala do določene višine. Višina vode se povečuje linearno s časom. Na sliki je graf funkcije $f$, ki prikazuje spreminjanje višine $h$ vode v bazenu v odvisnosti od časa $t$. Odgovorite na spodnja vprašanja. Višino vode merimo v metrih, čas pa v minutah.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.7,>=latex]\n  \\draw[->] (-0.3,0) -- (8.5,0) node[right] {$t$};\n  \\draw[->] (0,-0.3) -- (0,2.5) node[above] {$h$};\n  \\draw[gray!40] (0,0) grid[step=0.5] (8,2.2);\n  \\draw[thick] (0,0.5) -- (7.5,2);\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{enumerate}\n\\item Kolikšna je bila višina vode v bazenu ob začetku polnjenja?\n\\item Kolikšna je bila višina vode v bazenu eno uro po začetku polnjenja?\n\\item Za koliko se je povečala višina vode v bazenu vsakih $15$ minut?\n\\item Zapišite predpis funkcije $f$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Jesenski_Pola1_VR/prob_05.png?v=f2ed58", "tikz_originals": ["matura_refined/2019_Jesenski_Pola1_VR/prob_05.png"]}, "405": {"latex": "Nalogo rešite brez uporabe računala. Dana je funkcija $f:\\mathbb{R}-\\left\\{\\dfrac{\\pi}{2}+k\\pi,\\ k\\in\\mathbb{Z}\\right\\}\\to\\mathbb{R}$ s predpisom $f(x)=\\tan x-\\sin(2x)$.\n\n\\begin{enumerate}\n\\item Dokažite, da je $f$ periodična funkcija s periodo $\\pi$. Izračunajte vse ničle funkcije $f$.\n\\item V točki $T\\!\\left(\\dfrac{\\pi}{3},\\,y_0\\right)$ položimo tangento na graf funkcije $f$. Izračunajte njeno enačbo.\n\\item Poiščite tisto funkcijo $F:\\!\\left(\\dfrac{\\pi}{2},\\,\\dfrac{3\\pi}{2}\\right)\\to\\mathbb{R}$, za katero velja, da je $F'=f$ in $F(\\pi)=1$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Jesenski_Pola2_VR/prob_01.png?v=3f24e4"}, "406": {"latex": "Dan je enakokraki trapez $ABCD$ s podatki $a=|AB|=20\\ \\mathrm{cm}$, $b=|BC|=10\\ \\mathrm{cm}$, $c=|CD|=8\\ \\mathrm{cm}$, $d=|AD|=10\\ \\mathrm{cm}$.\n\n\\begin{enumerate}\n\\item Dokažite, da meri višina trapeza $8\\ \\mathrm{cm}$. Izračunajte prostornino pokončne prizme z višino $3\\ \\mathrm{cm}$, ki ima za osnovno ploskev trapez $ABCD$.\n\\item Izračunajte ploščino trapeza $A_1B_1C_1D_1$, ki ga dobimo s središčnim raztegom trapeza $ABCD$. Razteg ima središče v točki $A$ in faktor $\\sqrt{2}$.\n\\item Trapez $ABCD$ zavrtimo okrog njegove simetrale za $180^\\circ$. Izračunajte površino in prostornino nastale vrtenine.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Jesenski_Pola2_VR/prob_04.png?v=29ef3a"}, "407": {"latex": "Naj bosta $a,\\,b\\in\\mathbb{N}$ in naj bodo dana naravna števila $n_1=2^a\\cdot 3^b\\cdot 5^b\\cdot 7^b$, $n_2=2^b\\cdot 3^a\\cdot 5^b\\cdot 7^b$, $n_3=2^b\\cdot 3^b\\cdot 5^a\\cdot 7^b$, $n_4=2^b\\cdot 3^b\\cdot 5^b\\cdot 7^a$.\n\n\\begin{enumerate}\n\\item Za dana para števil $a$ in $b$ razvrstite števila $n_1,\\,n_2,\\,n_3$ in $n_4$ po velikosti od najmanjšega do največjega:\n\\begin{itemize}\n\\item $a=2019$ in $b=2018$: $\\rule{2cm}{0.4pt}<\\rule{2cm}{0.4pt}<\\rule{2cm}{0.4pt}<\\rule{2cm}{0.4pt}$\n\\item $a=2018$ in $b=2019$: $\\rule{2cm}{0.4pt}<\\rule{2cm}{0.4pt}<\\rule{2cm}{0.4pt}<\\rule{2cm}{0.4pt}$\n\\end{itemize}\n\\item Dokažite, da števili $n_1$ in $n_2$ nista niti praštevili niti tuji si števili.\n\\item V odvisnosti od parametrov $a$ in $b$ (za primere $a>b$, $a=b$ ali $a<b$) zapišite število $\\dfrac{n_1}{n_2}$ kot okrajšan ulomek.\n\\item V odvisnosti od $a$ in $b$ izračunajte največji skupni delitelj in najmanjši skupni večkratnik števil $n_1,\\,n_2,\\,n_3$ in $n_4$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Jesenski_Pola2_VR/prob_07.png?v=d35930"}, "408": {"latex": "Rešite naslednje naloge o zaporedjih, funkcijah iz $\\mathbb{N}$ v $\\mathbb{R}$.\n\n\\begin{enumerate}\n\\item Naj bo dana funkcija $f:\\mathbb{N}\\to\\mathbb{R}$ s predpisom $f(n)=\\dfrac{1}{4}n^2$. Narišite graf funkcije $f$. Ali je $f$ bijektivna funkcija? Odgovor utemeljite.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-1,0) -- (5,0) node[right] {$x$};\n  \\draw[->] (0,-1) -- (0,5) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\item V ravnini $\\mathbb{R}^2$ narišite množici $A=\\mathbb{N}\\times[-1,\\,2)$ in $B=\\mathbb{N}\\times\\{1\\}$. Ali je množica $A$ graf neke funkcije $f:\\mathbb{N}\\to\\mathbb{R}$? Odgovor utemeljite. Ali je množica $B$ graf neke funkcije $f:\\mathbb{N}\\to\\mathbb{R}$? Odgovor utemeljite.\n\n\\begin{center}\n\\begin{tabular}{cc}\n\\textbf{množica $A$} & \\textbf{množica $B$}\\\\\n\\begin{tikzpicture}[scale=0.45,>=latex]\n  \\draw[->] (-1,0) -- (5,0) node[right] {$x$};\n  \\draw[->] (0,-2) -- (0,3) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n&\n\\begin{tikzpicture}[scale=0.45,>=latex]\n  \\draw[->] (-1,0) -- (5,0) node[right] {$x$};\n  \\draw[->] (0,-2) -- (0,3) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{tabular}\n\\end{center}\n\\item Naj bo dana funkcija $f:\\mathbb{N}\\to\\mathbb{R}$ s predpisom $f(n)=\\dfrac{n}{n^2+1}$. Dokažite, da je $f$ padajoča in omejena funkcija.\n\\item Naj bo dana funkcija $f:\\mathbb{N}\\to\\mathbb{R}$ s predpisom $f(n)=\\sqrt{n}$. Izračunajte limito $\\displaystyle\\lim_{n\\to\\infty}\\bigl(f(n^2+n)-f(n^2)\\bigr)$.\n\\end{enumerate}", "tikz_count": 3, "body_image": "matura_refined/2019_Jesenski_Pola2_VR/prob_11.png?v=4b3786", "tikz_originals": ["matura_refined/2019_Jesenski_Pola2_VR/prob_11.png", "matura_refined/2019_Jesenski_Pola2_VR/prob_11.png", "matura_refined/2019_Jesenski_Pola2_VR/prob_11.png"]}, "409": {"latex": "Rešite naloge, zapisane v levem stolpcu preglednice. Rešitve zapišite v desni stolpec preglednice. Glejte rešeni primer.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.8}\n\\begin{tabular}{|p{7cm}|p{6.5cm}|}\n\\hline\nZapišite zalogo vrednosti funkcije s predpisom $f(x)=x^2+3$. & $Z_f=[3,\\,\\infty)$\\\\\n\\hline\nDoločite najmanjši skupni večkratnik števil $20$ in $30$. & $v(20,\\,30)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\nRešite enačbo $|x|=5$. & $x_1=\\rule{1.5cm}{0.4pt},\\quad x_2=\\rule{1.5cm}{0.4pt}$\\\\\n\\hline\nDoločite razdaljo med točkama $A(-1,\\,1)$ in $B(3,\\,1)$ v ravnini $\\mathbb{R}^2$. & $d(A,\\,B)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\nDoločite največjo množico $D_f$, za katero je funkcija s predpisom $f(x)=\\sqrt{x-2}$ definirana. & $D_f=\\rule{2cm}{0.4pt}$\\\\\n\\hline\nZapišite realni del kompleksnega števila $z=\\mathrm{i}^6+\\mathrm{i}^7$. & $\\mathrm{Re}(z)=\\rule{2cm}{0.4pt}$\\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_01.png?v=caf2e6"}, "410": {"latex": "Smučarski skakalec Peter je na treningu v prvih štirih skokih dosegel naslednje daljave: $95\\ \\mathrm{m}$, $101\\ \\mathrm{m}$, $93\\ \\mathrm{m}$ in $95\\ \\mathrm{m}$.\n\n\\begin{enumerate}\n\\item Izračunajte povprečno dolžino njegovih skokov.\n\\item Koliko metrov mora skočiti v petem skoku, da bo povprečje povečal na $98\\ \\mathrm{m}$?\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_02.png?v=89c6ea"}, "411": {"latex": "Rešite enačbi:\n\n\\begin{enumerate}\n\\item $2^{x+3}\\cdot 2^{x+5}=32$\n\\item $2^{x+3}+2^{x+5}=5$\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_03.png?v=4d4e2c"}, "412": {"latex": "Na sliki, na kateri so točke $A(-1,\\,1)$, $B(1,\\,1)$ in $C(0,\\,-3)$, narišite vektorja $\\vec{a}=\\overrightarrow{CA}$ in $\\vec{b}=\\overrightarrow{CB}$. Vektorja $\\vec{a}$ in $\\vec{b}$ zapišite s koordinatami (komponentami) in izračunajte skalarni produkt $\\vec{a}\\cdot\\vec{b}$. Kot $\\alpha$, ki ga oklepata vektorja $\\vec{a}$ in $\\vec{b}$, zaokrožite v stopinjah na dve decimalki. Rezultate zapišite v spodnjo preglednico.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.85,>=latex]\n  \\draw[->] (-2.5,0) -- (2.5,0) node[right] {$x$};\n  \\draw[->] (0,-3.5) -- (0,2.5) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n  \\draw (1,-0.07) -- (1,0.07);\n  \\fill (-1,1) circle (1.5pt) node[left] {$A$};\n  \\fill (1,1)  circle (1.5pt) node[right] {$B$};\n  \\fill (0,-3) circle (1.5pt) node[right] {$C$};\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.6}\n\\begin{tabular}{|p{6cm}|p{5cm}|}\n\\hline\n\\textbf{Naloga} & \\textbf{Rešitev}\\\\\n\\hline\nS koordinatami zapisan vektor $\\vec{a}$ & $\\vec{a}=(\\rule{1.2cm}{0.4pt},\\,\\rule{1.2cm}{0.4pt})$\\\\\n\\hline\nS koordinatami zapisan vektor $\\vec{b}$ & $\\vec{b}=(\\rule{1.2cm}{0.4pt},\\,\\rule{1.2cm}{0.4pt})$\\\\\n\\hline\nSkalarni produkt $\\vec{a}\\cdot\\vec{b}$ & $\\vec{a}\\cdot\\vec{b}=\\rule{2cm}{0.4pt}$\\\\\n\\hline\nIzračunan približek za kot $\\alpha$ & $\\alpha\\doteq\\rule{2cm}{0.4pt}$\\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 1, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_04.png?v=f3c037", "tikz_originals": ["matura_refined/2019_Spomladanski_Pola1_OR/prob_04.png"]}, "413": {"latex": "Na sliki sta narisani premica $p$ in krožnica $k$. Premica $p$ poteka skozi točki $A$ in $B$, premer krožnice $k$ je daljica $AB$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.7,>=latex]\n  \\draw[->] (-2.5,0) -- (6.5,0) node[right] {$x$};\n  \\draw[->] (0,-2) -- (0,7.5) node[above] {$y$};\n  \\fill[gray!40] (0,0) -- (0,6) arc[start angle=135,end angle=225,radius=3.6] -- cycle;\n  \\fill[gray!40] (1,0) -- (4,0) arc[start angle=-45,end angle=-90,radius=3.6] -- cycle;\n  \\draw[thick] (2,3) circle (3.6);\n  \\draw[thick] (-1.2,7.2) -- (5.2,-1.2);\n  \\fill (0,6) circle (1.5pt) node[above left] {$A$};\n  \\fill (4,0) circle (1.5pt) node[below right] {$B$};\n  \\node[left] at (0,1) {$1$};\n  \\node[left] at (0,6) {$6$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[below] at (4,0) {$4$};\n  \\node[right] at (5.4,-0.5) {$p$};\n  \\node[right] at (5,3) {$k$};\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{enumerate}\n\\item Zapišite enačbo premice $p$.\n\\item Zapišite enačbo krožnice $k$.\n\\item Izračunajte vsoto ploščin osenčenih odsekov na sliki. Nalogo rešite brez uporabe računala.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_05.png?v=bc931b", "tikz_originals": ["matura_refined/2019_Spomladanski_Pola1_OR/prob_05.png"]}, "414": {"latex": "V trikotniku $ABC$ stranica $AB$ meri $6\\ \\mathrm{cm}$. Kot $\\alpha=\\angle BAC$ meri $70^\\circ$ in kot $\\gamma=\\angle ACB$ meri $30^\\circ$. Izračunajte dolžino stranice $AC$ in ploščino trikotnika $ABC$. Rezultata zaokrožite na dve decimalki.", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_06.png?v=14c4b8"}, "415": {"latex": "Racionalna funkcija $f$ ima predpis $f(x)=\\dfrac{x-2}{x}$.\n\n\\begin{enumerate}\n\\item Zapišite enačbi asimptot grafa funkcije $f$ in narišite njen graf.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-4,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3} \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3} \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\item Izračunajte odvod funkcije $f$.\n\\item Izračunajte nedoločeni integral funkcije $f$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_07.png?v=1a3fe2", "tikz_originals": ["matura_refined/2019_Spomladanski_Pola1_OR/prob_07.png"]}, "416": {"latex": "V vreči je $50$ listkov, izmed katerih jih $40$ prinaša nagrade, preostalih $10$ pa ne.\n\n\\begin{enumerate}\n\\item Iz vreče naključno izvlečemo en listek. Izračunajte verjetnost dogodka $A$, da izbrani listek prinese nagrado.\n\\item Iz vreče naključno hkrati izvlečemo dva listka. Izračunajte verjetnost dogodka $B$, da oba izbrana listka prinašata nagrado.\n\\item Iz vreče naključno hkrati izvlečemo tri listke. Izračunajte verjetnost dogodka $C$, da vsaj en izbrani listek prinese nagrado.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_09.png?v=d24a33"}, "417": {"latex": "Gospa Marija je $12\\,500\\ \\mathrm{\\euro}$ vložila v banko, ki uporablja obrestno obrestovanje in $1{,}5\\,\\%$ letno obrestno mero. Banka pripiše obresti ob koncu vsakega iztečenega leta varčevanja. Pri nalogi upoštevajte, da banka ne spreminja svojih pogojev in da Marija ne dviga denarja naslednja $4$ leta.\n\n\\begin{enumerate}\n\\item Koliko evrov obresti so Mariji pripisali po prvem letu varčevanja? Zapišite odgovor.\n\\item Koliko denarja je imela Marija na banki po štirih letih varčevanja? Zapišite odgovor.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_10.png?v=0e1ec7"}, "418": {"latex": "Zapišite število $2019$ kot vsoto dveh realnih števil $x$ in $y$ tako, da bo vrednost izraza $xy-6x-9y+56$ največja.", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_11.png?v=f4a425"}, "419": {"latex": "Na smučišču Mrzli vrh lahko smučarji kupijo celodnevno vozovnico za odrasle ali celodnevno vozovnico za otroke do $18.$ leta, ki je za $40\\ \\%$ cenejša od celodnevne vozovnice za odrasle. Predšolskim otrokom lahko starši plačajo celodnevni smučarski tečaj pod vodstvom strokovnih vaditeljev. Cena vozovnice je v tem primeru všteta v ceno tečaja.\n\nČlani družine Novak se odpravijo na celodnevno smučanje na Mrzli vrh. Oče, mama in petnajstletni Maks kupijo celodnevne vozovnice, petletna dvojčka Ana in Tim pa dan preživita z vaditelji na smučarskem tečaju. To družino Novak stane $261\\ \\mathrm{\\euro}$.\n\nTudi člani družine Drolc se odpravijo na celodnevno smučanje na Mrzli vrh. Oče, mama, desetletna Maja in trinajstletni Bor kupijo celodnevne vozovnice, štiriletna Julija pa preživi dan z vaditelji na smučarskem tečaju. To družino Drolc stane $197\\ \\mathrm{\\euro}$.\n\nKolikšna je cena celodnevne vozovnice za odrasle in kolikšna je cena celodnevnega tečaja za enega otroka?", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola1_OR/prob_12.png?v=0a3f21"}, "420": {"latex": "Nalogo rešite brez uporabe računala. Dana je hiperbola z enačbo $x^2-y^2=1$.\n\n\\begin{enumerate}\n\\item Izračunajte enačbi tangent na dano hiperbolo v točkah $D_1(\\sqrt{2},\\,1)$ in $D_2(\\sqrt{2},\\,-1)$.\n\\item Tangenta $t$ z enačbo $y=\\sqrt{2}\\cdot x-1$ seka asimptoto z enačbo $y=x$ dane hiperbole v točki $P$. Naj bosta $F_1$ in $F_2$ gorišči dane hiperbole. Izračunajte točke $P$, $F_1$ in $F_2$ ter zapišite enačbo krožnice skozi te tri točke.\n\\item Območje, ki ga omejujejo tangenta $t$ z enačbo $y=\\sqrt{2}\\cdot x-1$, dana hiperbola in abscisna os, zavrtimo okoli abscisne osi za $360^\\circ$. Izračunajte volumen nastalega rotacijskega telesa.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola2_VR/prob_01.png?v=d62175"}, "421": {"latex": "Dana je krožnica s polmerom $6$ in središčem $S$. Točke $A$, $B$, $C$ in $D$ rišemo na krožnico tako, da sta kota $\\angle BAD$ in $\\angle ABC$ prava kota (glejte na sliki eno izmed možnih narisanih situacij). Velikost kota $\\angle CSD$ je odvisna od izbire položajev točk $A$, $B$, $C$ in $D$ na krožnici.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.85,>=latex]\n  \\draw[thick] (0,0) circle (3);\n  \\coordinate (S) at (0,0);\n  \\coordinate (A) at (-2.4,-1.8);\n  \\coordinate (B) at (2.4,-1.8);\n  \\coordinate (C) at (2.4,1.8);\n  \\coordinate (D) at (-2.4,1.8);\n  \\fill[gray!40] (A) -- (B) -- (C) -- (D) -- cycle;\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- cycle;\n  \\draw[thick] (S) -- (C);\n  \\draw[thick] (S) -- (D);\n  \\fill (S) circle (1.5pt) node[below] {$S$};\n  \\fill (A) circle (1.5pt) node[below left] {$A$};\n  \\fill (B) circle (1.5pt) node[below right] {$B$};\n  \\fill (C) circle (1.5pt) node[above right] {$C$};\n  \\fill (D) circle (1.5pt) node[above left] {$D$};\n  \\node at (0,0.35) {$\\varphi$};\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{enumerate}\n\\item Dokažite, da je za poljubne tako narisane točke $A$, $B$, $C$ in $D$ ploščina osenčenega območja v odvisnosti od velikosti kota $\\varphi=\\angle CSD$ enaka $S(\\varphi)=54\\sin\\varphi+18\\varphi$, če je kot $\\varphi$ izražen v radianih.\n\\item Za kateri topi kot $\\varphi=\\angle CSD$ je ploščina osenčenega območja največja? Kot zaokrožite na desetinko stopinje.\n\\item Zgornja slika prikazuje tudi prerez predora z ravnino, ki je pravokotna na smer vožnje. Krožnica na sliki ima polmer $6\\ \\mathrm{m}$, širina predora je $|AB|=6\\ \\mathrm{m}$, njegova dolžina pa je $120\\ \\mathrm{m}$. Ukrivljen strop in steni predora bodo prepleskali. V ta namen so kupili $400\\ \\ell$ barve. Ali bo barve dovolj, če za $40\\ \\mathrm{m}^2$ porabijo natanko $5\\ \\ell$ barve? Zapišite odgovor in ga utemeljite.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Spomladanski_Pola2_VR/prob_04.png?v=5c8f87", "tikz_originals": ["matura_refined/2019_Spomladanski_Pola2_VR/prob_04.png"]}, "422": {"latex": "Naj bo dana funkcija $f:\\mathbb{R}\\to\\mathbb{R}$ s predpisom $f(x)=2^{-x/2}$.\n\n\\begin{enumerate}\n\\item Narišite graf funkcije $f$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-4,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3} \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3} \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\item Izračunajte enačbo normale na graf funkcije $f$ v presečišču grafa funkcije $f$ in premice z enačbo $y=\\sqrt{2}$. Nalogo rešite brez uporabe računala.\n\\item Zapišite predpis inverzne funkcije $f^{-1}$ funkcije $f$. Izračunajte še $f\\!\\left(\\dfrac{1}{2}\\right)$, $f^{-1}\\!\\left(\\dfrac{1}{2}\\right)$, $f(1)$ in $f^{-1}(1)$ ter dokažite, da ima enačba $f(x)=f^{-1}(x)$ na intervalu $\\left[\\dfrac{1}{2},\\,1\\right]$ vsaj eno rešitev.\n\\item Izračunajte limito $\\displaystyle\\lim_{h\\to 0}\\dfrac{f(-1+h)-f(-1)}{h}$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2019_Spomladanski_Pola2_VR/prob_07.png?v=f2944b", "tikz_originals": ["matura_refined/2019_Spomladanski_Pola2_VR/prob_07.png"]}, "423": {"latex": "Za poljubno realno število $x$ definiramo geometrijsko zaporedje, katerega prvi člen je enak $x$, drugi člen pa je enak $x^3-4x$.\n\n\\begin{enumerate}\n\\item Poiščite vsa realna števila $x$, za katera je drugi člen enak $15$. Nalogo rešite brez uporabe računala.\n\\item Poiščite vsa realna števila $x$, za katera je pripadajoča geometrijska vrsta konvergentna. Nalogo rešite brez uporabe računala.\n\\item Naj bo $x=\\dfrac{11}{5}$ in naj ima pripadajoče geometrijsko zaporedje splošni člen $a_n$. Poiščite najmanjše naravno število $n$, za katerega je razlika $\\displaystyle\\sum_{i=1}^{\\infty}a_i-\\displaystyle\\sum_{i=1}^{n}a_i$ manjša od $\\dfrac{1}{100}$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2019_Spomladanski_Pola2_VR/prob_11.png?v=88dad2"}, "424": {"latex": "Rešite naloge, zapisane v levem stolpcu preglednice. Rešitve zapišite v desni stolpec. Glejte rešeni primer.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.8}\n\\begin{tabular}{|p{7cm}|p{7cm}|}\n\\hline\nZapišite zalogo vrednosti funkcije s predpisom $f(x)=3^x$. & $Z_f=(0,\\,\\infty)$\\\\\n\\hline\nŠtevilo $a=\\sqrt{\\sqrt[3]{5}}$ zapišite v obliki $a=\\sqrt[n]{5}$. & $a=\\rule{3cm}{0.4pt}$\\\\\n\\hline\nV množici $\\mathbb{C}$ rešite enačbo $x^2+9=0$. & $x_1=\\rule{2cm}{0.4pt},\\quad x_2=\\rule{2cm}{0.4pt}$\\\\\n\\hline\nIzračunajte skalarni produkt vektorjev $\\vec{a}=(-1,\\,3,\\,2)$ in $\\vec{b}=(2,\\,1,\\,5)$. & $\\vec{a}\\cdot\\vec{b}=\\rule{2cm}{0.4pt}$\\\\\n\\hline\nRešite enačbo $\\cos x=-1$. & \\\\\n\\hline\nDoločite limito zaporedja s splošnim členom $a_n=\\dfrac{3n-1}{2n+5}$. & $\\displaystyle\\lim_{n\\to\\infty}a_n=\\rule{2cm}{0.4pt}$\\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_01.png?v=640786"}, "425": {"latex": "Naj bo $n$ realno število in $f:\\mathbb{R}\\to\\mathbb{R}$ funkcija s predpisom $f(x)=-2x+n$.\n\n\\begin{enumerate}\n\\item Če je $n=-5$, izračunajte $f(-7)$ in ničlo funkcije $f$.\n\\item Izračunajte $n$, če je $f(3)=5$.\n\\item Izračunajte $n$, če je $f^{-1}(2)=4$, pri čemer je $f^{-1}$ inverzna funkcija funkcije $f$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_02.png?v=7feb1d"}, "426": {"latex": "Poraba avtomobila je $6$ litrov goriva na $100$ kilometrov, kombi pa z litrom goriva prevozi $12$ kilometrov. Koliko več goriva od avtomobila je porabil kombi, če sta obe vozili prevozili po $350$ kilometrov? Rezultat zaokrožite na tisočine litra.", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_03.png?v=62e1e4"}, "427": {"latex": "V aritmetičnem zaporedju je drugi člen enak $39$, peti pa $30$.\n\n\\begin{enumerate}\n\\item Izračunajte diferenco, prvi člen in $37.$ člen danega zaporedja.\n\\item Izračunajte vsoto prvih $50$ členov danega zaporedja.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_04.png?v=816b3e"}, "428": {"latex": "V trikotniku $ABC$ je dolžina stranice $AB$ enaka $c=|AB|=2\\ \\mathrm{cm}$, dolžina stranice $AC$ je enaka $b=|AC|=\\sqrt{2}\\ \\mathrm{cm}$ in velikost kota $\\angle ABC$ je enaka $\\beta=30^\\circ$. Izračunajte dolžino stranice $BC$. Zapišite obe rešitvi. Rezultat zaokrožite na stotinko centimetra.", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_06.png?v=bed056"}, "429": {"latex": "Dana je krožnica z enačbo $x^2+y^2-24x+6y+128=0$.\n\n\\begin{enumerate}\n\\item Izračunajte središče $S$ in polmer $r$ dane krožnice.\n\\item Koliko je dolga najdaljša tetiva dane krožnice?\n\\item Na krožnici narišemo točki $A$ in $B$, ki sta ena od druge oddaljeni za $5$ enot. Koliko stopinj meri ostri kot $\\angle ASB$?\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_07.png?v=b0620e"}, "430": {"latex": "V ravnini, opremljeni s koordinatnim sistemom, sta narisana grafa funkcij $f$ in $g$ s predpisoma $f(x)=x+1$ in $g(x)=\\dfrac{28}{6x-7}$ ter njuni presečišči $A$ in $B$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.6,>=latex,domain=-3:4.8,samples=80]\n  \\draw[->] (-3.5,0) -- (5.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,5) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left]  at (0,1) {$1$};\n  \\draw[thick] plot (\\x,\\x+1) node[right] {$f$};\n  \\draw[thick,domain=-2.5:1.15,samples=60] plot (\\x,{28/(6*\\x-7)});\n  \\draw[thick,domain=1.18:4.8,samples=60] plot (\\x,{28/(6*\\x-7)}) node[right] {$g$};\n  \\draw[dashed] (1.1667,-4) -- (1.1667,5);\n  \\fill (-3.5,-2.5) circle (2pt) node[left] {$A$};\n  \\fill (2.5,3.5) circle (2pt) node[above right] {$B$};\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{enumerate}\n\\item Izračunajte koordinate točk $A$ in $B$. Koordinate zapišite v obliki okrajšanih ulomkov.\n\\item Koliko je presečišče $A$ oddaljeno od vodoravne asimptote grafa funkcije $g$? Zapišite odgovor.\n\\item Koliko je presečišče $B$ oddaljeno od navpične asimptote grafa funkcije $g$? Zapišite odgovor.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_08.png?v=99e3e9", "tikz_originals": ["matura_refined/2020_Jesenski_Pola1_OR/prob_08.png"]}, "431": {"latex": "Dana je funkcija $f:\\mathbb{R}\\to\\mathbb{R}$ s predpisom $f(x)=4^x-2$.\n\n\\begin{enumerate}\n\\item Izračunajte ničlo in začetno vrednost funkcije $f$, zapišite enačbo vodoravne asimptote grafa funkcije $f$ in graf narišite.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-4,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3} \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3} \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left]  at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\item Izračunajte, pod kolikšnim kotom graf funkcije $f$ seka abscisno os. Kot zaokrožite na minuto.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_09.png?v=7b7a68", "tikz_originals": ["matura_refined/2020_Jesenski_Pola1_OR/prob_09.png"]}, "432": {"latex": "Za vsako naravno število $n$ je $z_n=\\mathrm{i}^n$ kompleksno število, pri čemer je $\\mathrm{i}$ imaginarna enota.\n\n\\begin{enumerate}\n\\item Izračunajte $z_1,\\,z_2,\\,z_3$ in $z_4$.\n\\item Izračunajte $z_{2019}+\\overline{z_{2020}}$.\n\\item Poiščite vsa naravna števila $n$, za katera je $z_n$ realno število.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_10.png?v=ec4d11"}, "433": {"latex": "Za funkcijo $f:\\mathbb{R}\\to\\mathbb{R}$ velja, da je $f(1)=1$ in $f'(x)=2x-1$ za vsak $x\\in\\mathbb{R}$. Zapišite predpis funkcije $f$.", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_11.png?v=3a898e"}, "434": {"latex": "Na mizi stojita majhna in velika žoga tako, da se dotikata. Obe imata obliko krogle. Velika žoga ima polmer $15\\ \\mathrm{cm}$ in se mize dotika v točki $A$. Majhna žoga ima polmer $5\\ \\mathrm{cm}$ in se mize dotika v točki $B$. Nalogo rešite brez uporabe računala.\n\n\\begin{enumerate}\n\\item Izračunajte prostornino velike žoge.\n\\item Kolikšna je razdalja med točkama $A$ in $B$?\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola1_OR/prob_12.png?v=adb1b8"}, "435": {"latex": "Nalogo rešite brez uporabe računala. Dana je funkcija $f:\\mathbb{R}\\to\\mathbb{R}$ s predpisom $f(x)=\\sin x+\\sqrt{3}\\cos x$.\n\n\\begin{enumerate}\n\\item Izračunajte vse ničle, stacionarne točke ter minimalno in maksimalno vrednost funkcije $f$.\n\\item Dokažite, da je $f(x)=2\\cdot\\sin\\!\\left(x+\\dfrac{\\pi}{3}\\right)$ za vsak $x\\in\\mathbb{R}$.\n\\item Narišite graf funkcije $f$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.65,>=latex]\n  \\draw[->] (-1.5,0) -- (6.5,0) node[right] {$x$};\n  \\draw[->] (0,-2.5) -- (0,2.6) node[above] {$y$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at ({pi/3},0) {$\\dfrac{\\pi}{3}$};\n  \\node[below] at (3.14,0) {$\\pi$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\item Izračunajte realno število $a\\in\\!\\left(0,\\,\\dfrac{2\\pi}{3}\\right)$, tako da bo ploščina območja med grafom funkcije $f$, abscisno osjo ter premicama $x=0$ in $x=a$ enaka $\\sqrt{2}+1$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2020_Jesenski_Pola2_VR/prob_01.png?v=04b44e", "tikz_originals": ["matura_refined/2020_Jesenski_Pola2_VR/prob_01.png"]}, "436": {"latex": "Rešite naslednje neenačbe:\n\n\\begin{enumerate}\n\\item $(x-1)^3-(x-2)^2-(x-3)<(x+1)^3$\n\\item $\\dfrac{x}{x-6}<\\dfrac{7}{x+3}+\\dfrac{38}{x^2-3x-18}$\n\\item $2\\sin\\!\\left(x+\\dfrac{\\pi}{4}\\right)+1>0$\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola2_VR/prob_05.png?v=198ad0"}, "437": {"latex": "Rešite naslednje naloge iz teorije števil.\n\n\\begin{enumerate}\n\\item Z Evklidovim algoritmom poiščite največji skupni delitelj števil $a=27\\,839$ in $b=58\\,685$.\n\\item Naj bo $n$ poljubno naravno število. Koliko deliteljev ima število $c=24^{n+2}\\cdot 6^{n-1}$ v množici naravnih števil?\n\\item Koliko števil iz množice $M=\\{n\\in\\mathbb{N};\\ n\\le 2700\\}$ je tujih številu $2700$?\n\\item S popolno (matematično) indukcijo dokažite, da je vsota $\\displaystyle\\sum_{k=1}^{n}\\dfrac{1}{2k(k+1)}$ enaka $\\dfrac{n}{2n+2}$ za vsako naravno število $n$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola2_VR/prob_08.png?v=9f52a0"}, "438": {"latex": "Dana je množica premic $M=\\{p;\\ p\\ \\text{ima enačbo}\\ y=kx+n,\\ k\\in\\mathbb{Z},\\ n\\in\\mathbb{Z},\\ |k|\\le 3,\\ |n|\\le 3\\}$.\n\n\\begin{enumerate}\n\\item Iz množice $M$ naključno izberemo eno premico. Izračunajte verjetnosti dogodkov:\\\\\n$A$ -- izbrana premica seka abscisno os v natanko eni točki $T(-1,\\,0)$;\\\\\n$B$ -- naklonski kot izbrane premice je $\\arctan 2$;\\\\\n$C$ -- izbrana premica in koordinatni osi omejujejo trikotnik s ploščino $S=2$.\n\\item Iz množice $M$ naključno hkrati izberemo štiri premice. Izračunajte verjetnost dogodka\\\\\n$D$ -- izbrane premice omejujejo lik, ki je paralelogram.\n\\item Iz množice $M$ naključno izberemo eno premico. Ta poskus ponovimo dvanajstkrat. Izračunajte verjetnost dogodka\\\\\n$E$ -- natanko osemkrat smo izbrali premico, ki je vzporedna simetrali sodih kvadrantov.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Jesenski_Pola2_VR/prob_12.png?v=2570af"}, "439": {"latex": "V preglednici so podane funkcije. K vsaki funkciji zapišite črko grafa, ki ji ustreza (glejte rešeni primer).\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.8}\n\\begin{tabular}{|p{6cm}|c|}\n\\hline\nFunkcija & Graf (zapišite črko)\\\\\n\\hline\n$f:\\mathbb{R}_0^+\\to\\mathbb{R},\\ f(x)=\\sqrt{x}$ & H\\\\\n\\hline\n$f:\\mathbb{R}-\\{0\\}\\to\\mathbb{R},\\ f(x)=x^{-1}$ & \\\\\n\\hline\n$f:\\mathbb{R}\\to\\mathbb{R},\\ f(x)=-x^2$ & \\\\\n\\hline\n$f:\\mathbb{R}\\to\\mathbb{R},\\ f(x)=2^x$ & \\\\\n\\hline\n$f:\\mathbb{R}-\\{0\\}\\to\\mathbb{R},\\ f(x)=x^{-2}$ & \\\\\n\\hline\n$f:\\mathbb{R}^+\\to\\mathbb{R},\\ f(x)=\\log_2 x$ & \\\\\n\\hline\n$f:\\mathbb{R}\\to\\mathbb{R},\\ f(x)=x^3$ & \\\\\n\\hline\n\\end{tabular}\n\\end{center}\n\nMožne izbire grafov (A--I):\n\n\\begin{center}\n\\begin{tabular}{ccc}\n\\textbf{A} (linearna) & \\textbf{B} ($-x^2$) & \\textbf{C} ($x^3$)\\\\\n\\textbf{D} ($x^{-1}$) & \\textbf{E} ($x^{-2}$) & \\textbf{F} ($\\log_2 x$)\\\\\n\\textbf{G} ($2^x$) & \\textbf{H} ($\\sqrt{x}$) & \\textbf{I} (kubična s preg.)\\\\\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_01.png?v=9fc3d5"}, "440": {"latex": "Vsota dveh števil je enaka $5661$. Drugo število je za $22\\ \\%$ vrednosti prvega števila večje od prvega števila. Izračunajte obe števili.", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_02.png?v=1beb9e"}, "441": {"latex": "Skicirajte pravokotnik $ABCD$ in poltraka s skupnim izhodiščem v oglišču $A$, ki razpolavljata vsak po eno od stranic $BC$ in $CD$. Izračunajte kot $\\varphi$ med danima poltrakoma, če je $|AB|=6\\ \\mathrm{cm}$ in $|AD|=4\\ \\mathrm{cm}$.", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_03.png?v=cc49a0"}, "442": {"latex": "Dana je kvadratna funkcija $f$ s predpisom $f(x)=-2x^2-4x$. Izračunajte ničli dane funkcije, izračunajte teme in narišite graf. Zapišite vse vrednosti $x$, za katere je $f(x)>0$. Na katerem intervalu je funkcija naraščajoča? Zapišite največji tak interval. Rešite enačbo $f(x)=-10$. Nalogo rešite brez računala.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-4,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3} \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3} \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left]  at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_04.png?v=b4d55c", "tikz_originals": ["matura_refined/2020_Spomladanski_Pola1_OR/prob_04.png"]}, "443": {"latex": "Brez uporabe računala rešite enačbi:\n\\begin{enumerate}\n\\item $9^{x-3}=3\\sqrt{3}$\n\\item $\\log_{\\frac{1}{5}}(3x-2)=-2$\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_05.png?v=f771d7"}, "444": {"latex": "V kvadratu z oglišči $A$, $B$, $C$, $D$ in stranico dolžine $a$ je točka $P$ razpolovišče stranice $CD$. Točka $T$ leži na stranici $BC$ tako, da je $|BT|:|TC|=1:3$. Narišite skico. Z vektorjema $\\vec{a}=\\overrightarrow{AB}$ in $\\vec{b}=\\overrightarrow{AD}$ izrazite vektorja $\\overrightarrow{AT}$ in $\\overrightarrow{AP}$. Preverite, da je skalarni produkt vektorjev $\\overrightarrow{AT}$ in $\\overrightarrow{AP}$ enak $\\dfrac{3}{4}a^2$.", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_06.png?v=5545d3"}, "445": {"latex": "Naj bo $a\\in\\mathbb{Z}$. Vrednost izraza $(1-\\sin x)^2+\\cos^2 x-2$ je enaka vrednosti izraza $a\\cdot\\sin x$ za vsak $x\\in\\mathbb{R}$. Izračunajte $a$. Za katere $x\\in\\mathbb{R}$ je vrednost tega izraza enaka $1$?", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_07.png?v=f84ea7"}, "446": {"latex": "Na sliki sta narisani premica $p$ in krožnica $K$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.85,>=latex]\n  \\draw[->] (-3.5,0) -- (3.5,0) node[right] {$x$};\n  \\draw[->] (0,-3.5) -- (0,3.0) node[above] {$y$};\n  \\draw[thick] (0,0) circle (1.7);\n  \\node[above right] at (1.2,1.2) {$K$};\n  \\node[left] at (-2,0) {$-2$};\n  \\node[below] at (2,-0.05) {$2$};\n  \\node[right] at (0,-2) {$-2$};\n  \\node[left] at (0,2) {$2$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n  \\draw[thick] (-2.8,2.8) -- (2.0,-2.0);\n  \\node[above left] at (-2.5,2.5) {$p$};\n\\end{tikzpicture}\n\\end{center}\n\n\\begin{enumerate}\n\\item Zapišite enačbi narisanih krivulj.\n\\item Izračunajte ploščino manjšega krožnega odseka, ki ga omejujeta premica $p$ in krožnica $K$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_08.png?v=395d74", "tikz_originals": ["matura_refined/2020_Spomladanski_Pola1_OR/prob_08.png"]}, "447": {"latex": "Funkcija $f:\\mathbb{R}-\\{0\\}\\to\\mathbb{R}$ ima predpis $f(x)=\\dfrac{1}{x^2}-2\\cos x+\\mathrm{e}^{3x}$.\n\n\\begin{enumerate}\n\\item Izračunajte odvod funkcije $f$.\n\\item Izračunajte nedoločeni integral funkcije $f$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_09.png?v=5abccf"}, "448": {"latex": "Dana so zaporedja s splošnimi členi $a_n=\\dfrac{3n}{2n+1}$, $b_n=2^n+1$ in $c_n=3^{-n}$.\n\n\\begin{enumerate}\n\\item Dokažite, da je zaporedje s splošnim členom $a_n$ omejeno.\n\\item Dokažite, da je zaporedje s splošnim členom $b_n$ naraščajoče.\n\\item Izračunajte $\\displaystyle\\lim_{n\\to\\infty}a_n$ in $\\displaystyle\\lim_{n\\to\\infty}c_n$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_10.png?v=6bc961"}, "449": {"latex": "Dane so števke $1,\\,2,\\,3,\\,4$ in $7$.\n\n\\begin{enumerate}\n\\item Iz danih števk naključno sestavimo trimestno število, pri katerem se števke lahko ponavljajo. Kolikšna je verjetnost, da sestavimo število, ki je deljivo s $4$?\n\\item Iz danih števk naključno sestavimo trimestno število, pri katerem se števke ne smejo ponavljati. Kolikšna je verjetnost, da sestavimo število, ki je deljivo s $3$?\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_11.png?v=cef789"}, "450": {"latex": "V pravilni štiristrani piramidi je stranska višina $v_1$ za $4\\ \\mathrm{cm}$ daljša od višine piramide $v$. Izračunajte dolžino osnovnega roba piramide, če meri njena prostornina $22\\ \\mathrm{cm}^3$. Nalogo rešite brez uporabe računala.", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola1_OR/prob_12.png?v=126e14"}, "451": {"latex": "Dana je funkcija $f$ s predpisom $f(x)=\\dfrac{x^2-9}{x+1}$.\n\n\\begin{enumerate}\n\\item Zapišite ničli in pol funkcije $f$. Zapišite enačbo poševne asimptote grafa funkcije $f$ in graf narišite.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.55,>=latex]\n  \\draw[->] (-4,0) -- (4.3,0) node[right] {$x$};\n  \\draw[->] (0,-4) -- (0,4.3) node[above] {$y$};\n  \\foreach \\x in {-3,-2,-1,1,2,3} \\draw (\\x,-0.1) -- (\\x,0.1);\n  \\foreach \\y in {-3,-2,-1,1,2,3} \\draw (-0.1,\\y) -- (0.1,\\y);\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\node[left] at (0,1) {$1$};\n\\end{tikzpicture}\n\\end{center}\n\\item Izračunajte, pod kolikšnim kotom graf funkcije $f$ seka ordinatno os.\n\\item Zapišite enačbo normale na graf funkcije $f$ v točki $T(x_0,\\,-4)$, $x_0>0$.\n\\item Izračunajte nedoločeni integral funkcije $h$, dane s predpisom $h(x)=\\dfrac{1}{f(x)}$.\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2020_Spomladanski_Pola2_VR/prob_01.png?v=5ac168", "tikz_originals": ["matura_refined/2020_Spomladanski_Pola2_VR/prob_01.png"]}, "452": {"latex": "Rešite naslednje naloge.\n\n\\begin{enumerate}\n\\item Dani sta množici $A=\\{x\\in\\mathbb{Q};\\ |x-2|-2x=1\\}$ in $B=\\left\\{n\\in\\mathbb{N};\\ \\binom{n+2}{n}=\\dfrac{n!}{(n-2)!}+4\\right\\}$. Zapišite množice $A$, $B$ in $A\\times B$, tako da naštejete njihove elemente.\n\\item Vsako izmed množic $C=\\{x\\in\\mathbb{R};\\ |2x-5|\\le 2\\}$, $D=\\left\\{x\\in\\mathbb{R};\\ \\dfrac{x}{x-2}\\ge 2\\right\\}$ in $C\\cap D$ zapišite kot interval.\n\\item V kompleksni ravnini narišite množici $E=\\{z\\in\\mathbb{C};\\ |z|^2+|z-2\\mathrm{i}|^2\\le 10\\}$ in $F=\\{z\\in\\mathbb{C};\\ |\\mathrm{Re}\\,z|+1<\\mathrm{Im}\\,z\\}$. Dokažite, da je ploščina območja $E-F$ enaka $3\\pi$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.85,>=latex]\n  \\draw[->] (-3,0) -- (3.3,0) node[right] {};\n  \\draw[->] (0,-3) -- (0,3.3) node[above] {};\n  \\fill (0,1) circle (1.5pt);\n  \\node[left] at (0,1) {$\\mathrm{i}$};\n  \\node[below left] at (0,0) {$0$};\n  \\node[below] at (1,0) {$1$};\n  \\draw (1,-0.07) -- (1,0.07);\n\\end{tikzpicture}\n\\end{center}\n\\end{enumerate}", "tikz_count": 1, "body_image": "matura_refined/2020_Spomladanski_Pola2_VR/prob_05.png?v=20bb26", "tikz_originals": ["matura_refined/2020_Spomladanski_Pola2_VR/prob_05.png"]}, "453": {"latex": "Naj bo dana funkcija $f:\\mathbb{R}\\to\\mathbb{R}$ s predpisom $f(x)=x\\sin x$.\n\n\\begin{enumerate}\n\\item Dokažite, da je funkcija $f$ soda.\n\\item Izračunajte limito $\\displaystyle\\lim_{x\\to 0}\\dfrac{x\\cdot f'(x)}{f(x)}$.\n\\item Izračunajte $\\displaystyle\\int f(x)\\,\\mathrm{d}x$.\n\\item Za vsako naravno število $n$ naj $S_n$ označuje ploščino lika, ki ga graf funkcije $f$ omejuje z abscisno osjo med dvema sosednjima ničlama $x_n=n\\cdot\\pi$ in $x_{n+1}=(n+1)\\cdot\\pi$. Dokažite, da je za vsak $n\\in\\mathbb{N}$ ploščina $S_n=(2n+1)\\cdot\\pi$.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola2_VR/prob_08.png?v=fa79d6"}, "454": {"latex": "Naj bo funkcija $f$ dana s predpisom $f(x)=\\displaystyle\\sum_{k=0}^{100} x^k = 1+x+x^2+x^3+\\ldots+x^{100}$.\n\n\\begin{enumerate}\n\\item Izračunajte $f(1)$ in $f\\!\\left(\\dfrac{1}{2}\\right)$.\n\\item Brez uporabe računala izračunajte $\\displaystyle\\int_{0}^{1}(x-1)f(x)\\,\\mathrm{d}x$.\n\\item Naj bo $f_n(x)=\\displaystyle\\sum_{k=0}^{n} x^k = 1+x+x^2+x^3+\\ldots+x^n$ za vsak $n\\in\\mathbb{N}$. Izračunajte $\\displaystyle\\lim_{n\\to\\infty} f_n\\!\\left(\\dfrac{1}{4}\\right)$.\n\\item Z matematično (popolno) indukcijo dokažite, da za vsak $n\\in\\mathbb{N}$ velja $f_n(-1)=0$, če je $n$ liho število, in $f_n(-1)=1$, če je $n$ sodo število.\n\\end{enumerate}", "tikz_count": 0, "body_image": "matura_refined/2020_Spomladanski_Pola2_VR/prob_12.png?v=c58941"}};</script>
