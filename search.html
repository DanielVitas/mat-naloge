i sistem v ravnini"], "latex": "Izračunajte ploščino osenčenega lika na sliki.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.9,>=latex]\n  \\draw[gray!40] (0,0) grid (5,4);\n  \\draw[->] (0,0) -- (5.4,0);\n  \\draw[->] (0,0) -- (0,4.4);\n  \\foreach \\x in {0,1,2,3,4,5} \\node[below] at (\\x,0) {\\x};\n  \\foreach \\y in {1,2,3,4} \\node[left] at (0,\\y) {\\y};\n  \\filldraw[fill=gray!40, draw=black, thick]\n    (0,3) -- (4,4) -- (5,2) -- (2,0) -- cycle;\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1}, {"n": 9, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["OR"], "section_letters": ["B"], "points_list": ["7 točk"], "points_ns": [7], "topics": ["4.2 Množice", "4.3 Številske množice", "4.3.1 Naravna in cela števila"], "latex": "Naj bo $A$ množica vseh praštevil, manjših od $20$, $B$ množica vseh deliteljev števila $12$ in $C$ množica vseh večkratnikov števila $3$, manjših od $20$.\nZapišite množice $A$, $B$, $C$, $A\\cap B$ in $B\\cup C$.", "tikz_count": 0}, {"n": 10, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["OR", "VR"], "section_letters": ["B"], "points_list": ["7 točk"], "points_ns": [7], "topics": ["4.4 Algebrski izrazi, enačbe in neenačbe", "4.10 Funkcije", "4.10.4 Kvadratna funkcija", "4.8 Vektorji v ravnini in prostoru", "4.8.1 Ravninski vektorji"], "latex": "Izračunajte diskriminante in poiščite vse rešitve kvadratnih enačb. Rezultate zapišite v preglednico.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.6}\n\\begin{tabular}{|c|c|c|}\n\\hline\n\\textbf{Enačba} & \\textbf{Diskriminanta} & \\textbf{Rešitve enačbe}\\\\\n\\hline\n$x^{2}-6x+9=0$    & & \\\\\n\\hline\n$x^{2}-3x-10=0$   & & \\\\\n\\hline\n$x^{2}-6x+10=0$   & & \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0}, {"n": 11, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["OR", "VR"], "section_letters": ["B"], "points_list": ["5 točk"], "points_ns": [5], "topics": ["4.6 Geometrija v ravnini in prostoru", "4.7 Geometrijski liki in telesa", "4.9 Pravokotni koordinatni sistem v ravnini", "4.10 Funkcije", "4.10.9 Kotne funkcije"], "latex": "Na sliki je narisana krožnica s središčem v izhodišču koordinatnega sistema in polmerom $1$.\nTočki $A$ in $B$ ležita na krožnici, točka $A'$ je pravokotna projekcija točke $A$ na abscisno os, točka $C$ pa izhodišče koordinatnega sistema.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=2.4,>=latex]\n  \\draw[->] (-1.25,0) -- (1.3,0) node[right] {$x$};\n  \\draw[->] (0,-1.25) -- (0,1.3) node[above] {$y$};\n  \\draw (0,0) circle (1);\n  \\node[below] at (1,0)  {$1$};\n  \\node[below] at (-1,0) {$-1$};\n  \\node[left]  at (0,1)  {$1$};\n  \\node[left]  at (0,-1) {$-1$};\n  \\coordinate (A) at (-0.866,0.5);\n  \\coordinate (Ap) at (-0.866,0);\n  \\coordinate (C)  at (0,0);\n  \\coordinate (B)  at (0.5,-0.866);\n  \\coordinate (Xax) at (1,0);\n  \\fill (A) circle (0.6pt);\n  \\fill (Ap) circle (0.6pt);\n  \\fill (B) circle (0.6pt);\n  \\node[above left=-1pt] at (A) {$A\\!\\left(-\\tfrac{\\sqrt{3}}{2},\\,\\tfrac{1}{2}\\right)$};\n  \\node[below left] at (Ap) {$A'$};\n  \\node[above right=-1pt] at (C) {$C(0,0)$};\n  \\node[below right] at (B) {$B(x_{1},\\,y_{1})$};\n  \\node[anchor=west] at (0.18,-0.18) {\\small$\\alpha\\!=\\!60^\\circ$};\n  \\draw (A) -- (C) -- (B);\n  \\draw (A) -- (Ap);\n  \\pic [draw, angle radius=4mm] {angle = Xax--C--B};\n\\end{tikzpicture}\n\\end{center}\n\nIzračunajte natančni vrednosti neznanih koordinat $x_{1}$ in $y_{1}$ točke $B$ na sliki.\\\\\nNatančno izračunajte obseg in ploščino trikotnika $\\triangle CAA'$.", "tikz_count": 1}, {"n": 12, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["OR", "VR"], "section_letters": ["B"], "points_list": ["6 točk"], "points_ns": [6], "topics": ["4.10 Funkcije", "4.10.6 Logaritemska funkcija"], "latex": "Naj bosta $a=\\log_{5} 2$ in $b=\\log_{5} 3$. Logaritme $\\log_{5} 6$, $\\log_{5} 2\\sqrt{3}$ in $\\log_{5} 0{,}\\overline{3}$ izrazite z $a$ in $b$.", "tikz_count": 0}, {"n": 13, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["OR", "VR"], "section_letters": ["B"], "points_list": ["7 točk"], "points_ns": [7], "topics": ["4.10 Funkcije", "4.10.8 Racionalna funkcija", "4.13 Diferencialni račun"], "latex": "Dana je funkcija $f(x)=\\dfrac{x^{2}}{x-2}$. Izračunajte stacionarni točki funkcije $f$. Zapišite enačbo tangente na graf funkcije $f$ v točki z absciso $-2$.", "tikz_count": 0}, {"n": 14, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["OR", "VR"], "section_letters": ["B"], "points_list": ["8 točk"], "points_ns": [8], "topics": ["4.11 Stožnice"], "latex": "Premica z enačbo $y=2x$ je asimptota hiperbole s središčem v točki $S(0,0)$. Gorišči hiperbole ležita na abscisni osi, točka $A\\!\\left(\\sqrt{6},\\,2\\sqrt{3}\\right)$ pa leži na hiperboli.\n\n\\begin{itemize}[leftmargin=2em,itemsep=2pt,topsep=2pt]\n  \\item Zapišite enačbo hiperbole.\n  \\item Dano hiperbolo prezrcalimo preko simetrale lihih kvadrantov. Zapišite enačbo prezrcaljene hiperbole.\n\\end{itemize}", "tikz_count": 0}, {"n": 15, "source": "Matura", "year": "2025", "seasons": ["Spomladanski rok"], "polas": ["Izpitna pola 1"], "polas_n": ["1"], "levels": ["VR"], "section_letters": ["C"], "points_list": ["2 točki"], "points_ns": [2], "topics": ["4.8 Vektorji v ravnini in prostoru", "4.8.1 Ravninski vektorji"], "latex": "Na sliki sta narisana vektorja $\\vec{a}$ in $\\vec{b}$. Lik $ABCDEF$ je pravilni šestkotnik s stranicami dolžine ena. Točka $T$ je razpolovišče daljice $DE$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.1,>=latex]\n  \\foreach \\i/\\name in {0/B, 1/C, 2/D, 3/F\\,doesnotmatter, 4/E, 5/F} {} % placeholder\n  \\coordinate (A) at (-1,0);\n  \\coordinate (B) at (1,0);\n  \\coordinate (C) at (2,1.732);\n  \\coordinate (D) at (1,3.464);\n  \\coordinate (E) at (-1,3.464);\n  \\coordinate (F) at (-2,1.732);\n  \\coordinate (T) at (0,3.464);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- (E) -- (F) -- cycle;\n  \\node[below left]  at (A) {$A$};\n  \\node[below right] at (B) {$B$};\n  \\node[right]       at (C) {$C$};\n  \\node[above right] at (D) {$D$};\n  \\node[above]       at (T) {$T$};\n  \\node[above left]  at (E) {$E$};\n  \\node[left]        at (F) {$F$};\n  \\fill (T) circle (1pt);\n  \\draw[->,thick] (A) -- node[below] {$\\vec{a}$} (B);\n  \\draw[->,thick] (B) -- node[right] {$\\vec{b}$} (C);\n\\end{tikzpicture}\n\\end{center}\n\n\\textit{1.1.}\\quad Izrazite vektorja $\\vec{AC}$ in $\\vec{BT}$ kot linearni kombinaciji vektorjev $\\vec{a}$ in $\\vec{b}$ ter izračunajte dolžino daljice $|BT|$.", "tikz_count": 1}];</script>
