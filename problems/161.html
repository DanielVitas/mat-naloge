<script>
  // Prevent orphaned commas/periods/semicolons/colons at the start of a
  // line. Inline math (`<mjx-container>`) is rendered as an inline-block
  // atom, so the browser can wrap between the container and a trailing
  // punctuation character. We wrap each `<mjx-container>` + the
  // immediately-following punctuation in a `white-space: nowrap` span so
  // the pair acts as a single line-breaking unit.
  window.glueOrphanPunctuation = function (root) {
    if (!root || !root.querySelectorAll) return;
    var containers = root.querySelectorAll('mjx-container');

      if (mjx.dataset && mjx.dataset.gluedPunc) return;
      var next = mjx.nextSibling;
      if (!next || next.nodeType !== Node.TEXT_NODE) return;

      if (!m) return;
      var punc = m[0];
      var rest = t.slice(punc.length);
      var wrap = document.createElement('span');
      wrap.style.whiteSpace = 'nowrap';
      mjx.parentNode.insertBefore(wrap, mjx);
      wrap.appendChild(mjx);
      wrap.appendChild(document.createTextNode(punc));
      next.nodeValue = rest;
      if (mjx.dataset) mjx.dataset.gluedPunc = '1';
    });
  };
