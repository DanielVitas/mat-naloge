<script>window.PROBLEMS = [{"n": 1, "latex": "Izraz $\\dfrac{(a^{3})^{2}}{a^{8}}$ zapišite v obliki $a^{m}$, kjer je $m$ celo število.", "tikz_count": 0, "section_letters": ["A"]}, {"n": 2, "latex": "Rešite enačbo $\\;2\\cdot\\left(\\dfrac{1}{3}\\right)^{x}=54.$", "tikz_count": 0, "section_letters": ["A"]}, {"n": 3, "latex": "Naj bo $z=4-i$. Z računom pokažite, da je število\n$\\;w=\\dfrac{1}{4}\\overline{z}-\\dfrac{3}{4}z\\;$\nenako $w=-2+i$. Število $w$ predstavite v kompleksni ravnini.", "tikz_count": 0, "section_letters": ["A"]}, {"n": 4, "latex": "Izračunajte abscisi presečišč premice $y=2x$ in krožnice $x^{2}+y^{2}=5$.", "tikz_count": 0, "section_letters": ["A"]}, {"n": 5, "latex": "Na skici spodaj je štirikotnik $ABCD$. Izračunajte kota $\\beta$ in $\\gamma$, če je $\\gamma=2\\beta$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.0,>=latex]\n  \\coordinate (A) at (0,0);\n  \\coordinate (B) at (5.4,0);\n  \\coordinate (C) at (4.6,2.6);\n  \\coordinate (D) at (1.6,3.0);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- cycle;\n  \\node[below left]  at (A) {$A$};\n  \\node[below right] at (B) {$B$};\n  \\node[above right] at (C) {$C$};\n  \\node[above left]  at (D) {$D$};\n  \\pic [draw, \"$70^\\circ$\", angle radius=8mm, angle eccentricity=1.45]\n       {angle = B--A--D};\n  \\pic [draw, \"$\\beta$\", angle radius=8mm, angle eccentricity=1.6]\n       {angle = C--B--A};\n  \\pic [draw, \"$101^\\circ$\", angle radius=8mm, angle eccentricity=1.6]\n       {angle = D--C--B};\n  \\pic [draw, \"$\\gamma$\", angle radius=8mm, angle eccentricity=1.55]\n       {angle = A--D--C};\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "section_letters": ["A"]}, {"n": 6, "latex": "Izračunajte nedoločeni integral $\\displaystyle\\int\\!\\bigl(4+x^{2}+\\sin x\\bigr)\\,\\mathrm{d}x$.", "tikz_count": 0, "section_letters": ["A"]}, {"n": 7, "latex": "Izračunajte površino enakostraničnega valja s polmerom osnovne ploskve $r=3$.", "tikz_count": 0, "section_letters": ["A"]}, {"n": 8, "latex": "Izračunajte ploščino osenčenega lika na sliki.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=0.9,>=latex]\n  \\draw[gray!40] (0,0) grid (5,4);\n  \\draw[->] (0,0) -- (5.4,0);\n  \\draw[->] (0,0) -- (0,4.4);\n  \\foreach \\x in {0,1,2,3,4,5} \\node[below] at (\\x,0) {\\x};\n  \\foreach \\y in {1,2,3,4} \\node[left] at (0,\\y) {\\y};\n  \\filldraw[fill=gray!40, draw=black, thick]\n    (0,3) -- (4,4) -- (5,2) -- (2,0) -- cycle;\n\\end{tikzpicture}\n\\end{center}", "tikz_count": 1, "section_letters": ["A"]}, {"n": 9, "latex": "Naj bo $A$ množica vseh praštevil, manjših od $20$, $B$ množica vseh deliteljev števila $12$ in $C$ množica vseh večkratnikov števila $3$, manjših od $20$.\nZapišite množice $A$, $B$, $C$, $A\\cap B$ in $B\\cup C$.", "tikz_count": 0, "section_letters": ["B"]}, {"n": 10, "latex": "Izračunajte diskriminante in poiščite vse rešitve kvadratnih enačb. Rezultate zapišite v preglednico.\n\n\\begin{center}\n\\renewcommand{\\arraystretch}{1.6}\n\\begin{tabular}{|c|c|c|}\n\\hline\n\\textbf{Enačba} & \\textbf{Diskriminanta} & \\textbf{Rešitve enačbe}\\\\\n\\hline\n$x^{2}-6x+9=0$    & & \\\\\n\\hline\n$x^{2}-3x-10=0$   & & \\\\\n\\hline\n$x^{2}-6x+10=0$   & & \\\\\n\\hline\n\\end{tabular}\n\\end{center}", "tikz_count": 0, "section_letters": ["B"]}, {"n": 11, "latex": "Na sliki je narisana krožnica s središčem v izhodišču koordinatnega sistema in polmerom $1$.\nTočki $A$ in $B$ ležita na krožnici, točka $A'$ je pravokotna projekcija točke $A$ na abscisno os, točka $C$ pa izhodišče koordinatnega sistema.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=2.4,>=latex]\n  \\draw[->] (-1.25,0) -- (1.3,0) node[right] {$x$};\n  \\draw[->] (0,-1.25) -- (0,1.3) node[above] {$y$};\n  \\draw (0,0) circle (1);\n  \\node[below] at (1,0)  {$1$};\n  \\node[below] at (-1,0) {$-1$};\n  \\node[left]  at (0,1)  {$1$};\n  \\node[left]  at (0,-1) {$-1$};\n  \\coordinate (A) at (-0.866,0.5);\n  \\coordinate (Ap) at (-0.866,0);\n  \\coordinate (C)  at (0,0);\n  \\coordinate (B)  at (0.5,-0.866);\n  \\coordinate (Xax) at (1,0);\n  \\fill (A) circle (0.6pt);\n  \\fill (Ap) circle (0.6pt);\n  \\fill (B) circle (0.6pt);\n  \\node[above left=-1pt] at (A) {$A\\!\\left(-\\tfrac{\\sqrt{3}}{2},\\,\\tfrac{1}{2}\\right)$};\n  \\node[below left] at (Ap) {$A'$};\n  \\node[above right=-1pt] at (C) {$C(0,0)$};\n  \\node[below right] at (B) {$B(x_{1},\\,y_{1})$};\n  \\node[anchor=west] at (0.18,-0.18) {\\small$\\alpha\\!=\\!60^\\circ$};\n  \\draw (A) -- (C) -- (B);\n  \\draw (A) -- (Ap);\n  \\pic [draw, angle radius=4mm] {angle = Xax--C--B};\n\\end{tikzpicture}\n\\end{center}\n\nIzračunajte natančni vrednosti neznanih koordinat $x_{1}$ in $y_{1}$ točke $B$ na sliki.\\\\\nNatančno izračunajte obseg in ploščino trikotnika $\\triangle CAA'$.", "tikz_count": 1, "section_letters": ["B"]}, {"n": 12, "latex": "Naj bosta $a=\\log_{5} 2$ in $b=\\log_{5} 3$. Logaritme $\\log_{5} 6$, $\\log_{5} 2\\sqrt{3}$ in $\\log_{5} 0{,}\\overline{3}$ izrazite z $a$ in $b$.", "tikz_count": 0, "section_letters": ["B"]}, {"n": 13, "latex": "Dana je funkcija $f(x)=\\dfrac{x^{2}}{x-2}$. Izračunajte stacionarni točki funkcije $f$. Zapišite enačbo tangente na graf funkcije $f$ v točki z absciso $-2$.", "tikz_count": 0, "section_letters": ["B"]}, {"n": 14, "latex": "Premica z enačbo $y=2x$ je asimptota hiperbole s središčem v točki $S(0,0)$. Gorišči hiperbole ležita na abscisni osi, točka $A\\!\\left(\\sqrt{6},\\,2\\sqrt{3}\\right)$ pa leži na hiperboli.\n\n\\begin{itemize}[leftmargin=2em,itemsep=2pt,topsep=2pt]\n  \\item Zapišite enačbo hiperbole.\n  \\item Dano hiperbolo prezrcalimo preko simetrale lihih kvadrantov. Zapišite enačbo prezrcaljene hiperbole.\n\\end{itemize}", "tikz_count": 0, "section_letters": ["B"]}, {"n": 15, "latex": "Na sliki sta narisana vektorja $\\vec{a}$ in $\\vec{b}$. Lik $ABCDEF$ je pravilni šestkotnik s stranicami dolžine ena. Točka $T$ je razpolovišče daljice $DE$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.1,>=latex]\n  \\coordinate (A) at (-1,0);\n  \\coordinate (B) at (1,0);\n  \\coordinate (C) at (2,1.732);\n  \\coordinate (D) at (1,3.464);\n  \\coordinate (E) at (-1,3.464);\n  \\coordinate (F) at (-2,1.732);\n  \\coordinate (T) at (0,3.464);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- (E) -- (F) -- cycle;\n  \\node[below left]  at (A) {$A$};\n  \\node[below right] at (B) {$B$};\n  \\node[right]       at (C) {$C$};\n  \\node[above right] at (D) {$D$};\n  \\node[above]       at (T) {$T$};\n  \\node[above left]  at (E) {$E$};\n  \\node[left]        at (F) {$F$};\n  \\fill (T) circle (1pt);\n  \\draw[->,thick] (A) -- node[below] {$\\vec{a}$} (B);\n  \\draw[->,thick] (B) -- node[right] {$\\vec{b}$} (C);\n\\end{tikzpicture}\n\\end{center}\n\n\\textit{1.1.}\\quad Izrazite vektorja $\\vec{AC}$ in $\\vec{BT}$ kot linearni kombinaciji vektorjev $\\vec{a}$ in $\\vec{b}$ ter izračunajte dolžino daljice $|BT|$.\\hfill\\textit{(2 točki)}\n\n\\textit{1.2.}\\quad Daljici $AC$ in $BT$ se sekata v točki $U$. Izračunajte razmerje $|AU|:|UC|$.\\hfill\\textit{(4 točke)}\n\n\\textit{1.3.}\\quad Naj bosta $\\vec{u}=\\vec{a}+\\vec{b}$ in $\\vec{w}=2\\vec{b}-\\dfrac{3}{2}\\vec{a}$. Vektor $\\dfrac{7}{2}\\vec{a}-\\dfrac{7}{2}\\vec{b}$ izrazite kot linearno kombinacijo vektorjev $\\vec{u}$ in $\\vec{w}$.\\hfill\\textit{(4 točke)}", "tikz_count": 1, "section_letters": ["C"]}];</script>

e[above right=-1pt] at (C) {$C(0,0)$};\n  \\node[below right] at (B) {$B(x_{1},\\,y_{1})$};\n  \\node[anchor=west] at (0.18,-0.18) {\\small$\\alpha\\!=\\!60^\\circ$};\n  \\draw (A) -- (C) -- (B);\n  \\draw (A) -- (Ap);\n  \\pic [draw, angle radius=4mm] {angle = Xax--C--B};\n\\end{tikzpicture}\n\\end{center}\n\nIzračunajte natančni vrednosti neznanih koordinat $x_{1}$ in $y_{1}$ točke $B$ na sliki.\\\\\nNatančno izračunajte obseg in ploščino trikotnika $\\triangle CAA'$.", "tikz_count": 1}, "12": {"latex": "Naj bosta $a=\\log_{5} 2$ in $b=\\log_{5} 3$. Logaritme $\\log_{5} 6$, $\\log_{5} 2\\sqrt{3}$ in $\\log_{5} 0{,}\\overline{3}$ izrazite z $a$ in $b$.", "tikz_count": 0}, "13": {"latex": "Dana je funkcija $f(x)=\\dfrac{x^{2}}{x-2}$. Izračunajte stacionarni točki funkcije $f$. Zapišite enačbo tangente na graf funkcije $f$ v točki z absciso $-2$.", "tikz_count": 0}, "14": {"latex": "Premica z enačbo $y=2x$ je asimptota hiperbole s središčem v točki $S(0,0)$. Gorišči hiperbole ležita na abscisni osi, točka $A\\!\\left(\\sqrt{6},\\,2\\sqrt{3}\\right)$ pa leži na hiperboli.\n\n\\begin{itemize}[leftmargin=2em,itemsep=2pt,topsep=2pt]\n  \\item Zapišite enačbo hiperbole.\n  \\item Dano hiperbolo prezrcalimo preko simetrale lihih kvadrantov. Zapišite enačbo prezrcaljene hiperbole.\n\\end{itemize}", "tikz_count": 0}, "15": {"latex": "Na sliki sta narisana vektorja $\\vec{a}$ in $\\vec{b}$. Lik $ABCDEF$ je pravilni šestkotnik s stranicami dolžine ena. Točka $T$ je razpolovišče daljice $DE$.\n\n\\begin{center}\n\\begin{tikzpicture}[scale=1.1,>=latex]\n  \\coordinate (A) at (-1,0);\n  \\coordinate (B) at (1,0);\n  \\coordinate (C) at (2,1.732);\n  \\coordinate (D) at (1,3.464);\n  \\coordinate (E) at (-1,3.464);\n  \\coordinate (F) at (-2,1.732);\n  \\coordinate (T) at (0,3.464);\n  \\draw[thick] (A) -- (B) -- (C) -- (D) -- (E) -- (F) -- cycle;\n  \\node[below left]  at (A) {$A$};\n  \\node[below right] at (B) {$B$};\n  \\node[right]       at (C) {$C$};\n  \\node[above right] at (D) {$D$};\n  \\node[above]       at (T) {$T$};\n  \\node[above left]  at (E) {$E$};\n  \\node[left]        at (F) {$F$};\n  \\fill (T) circle (1pt);\n  \\draw[->,thick] (A) -- node[below] {$\\vec{a}$} (B);\n  \\draw[->,thick] (B) -- node[right] {$\\vec{b}$} (C);\n\\end{tikzpicture}\n\\end{center}\n\n\\textit{1.1.}\\quad Izrazite vektorja $\\vec{AC}$ in $\\vec{BT}$ kot linearni kombinaciji vektorjev $\\vec{a}$ in $\\vec{b}$ ter izračunajte dolžino daljice $|BT|$.\\hfill\\textit{(2 točki)}\n\n\\textit{1.2.}\\quad Daljici $AC$ in $BT$ se sekata v točki $U$. Izračunajte razmerje $|AU|:|UC|$.\\hfill\\textit{(4 točke)}\n\n\\textit{1.3.}\\quad Naj bosta $\\vec{u}=\\vec{a}+\\vec{b}$ in $\\vec{w}=2\\vec{b}-\\dfrac{3}{2}\\vec{a}$. Vektor $\\dfrac{7}{2}\\vec{a}-\\dfrac{7}{2}\\vec{b}$ izrazite kot linearno kombinacijo vektorjev $\\vec{u}$ in $\\vec{w}$.\\hfill\\textit{(4 točke)}", "tikz_count": 1}};</script>
